name: Reusable native artifact smoke

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub-hosted runner label
        required: true
        type: string
      rust-target:
        description: Native Rust target triple used by the CLI and Node binding
        required: true
        type: string
      python-target:
        description: Target name accepted by maturin-action
        required: true
        type: string
      npm-platform:
        description: napi-rs platform package directory
        required: true
        type: string
      cli-features:
        description: Extra Cargo feature arguments for the shipped CLI
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '10.13'

jobs:
  build:
    name: Build release packages
    runs-on: ${{ inputs.runner }}
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev dbus
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ inputs.rust-target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: artifact-smoke-${{ inputs.rust-target }}
      - name: Build shipped CLI executable
        run: cargo build --release --target ${{ inputs.rust-target }} --package rookie-cookies-cli --bin rookie-cookies ${{ inputs.cli-features }}
      - name: Build Python wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ inputs.python-target }}
          args: --release --out dist --find-interpreter
          sccache: true
          manylinux: auto
          working-directory: bindings/python
      - name: Install Node build dependencies
        working-directory: bindings/node
        run: npm ci
      - name: Build native Node binding
        working-directory: bindings/node
        run: npm run build -- --target ${{ inputs.rust-target }}
      - name: Assemble release-shaped packages and provenance
        run: python tests/artifact_smoke/package_release_artifacts.py --target "${{ inputs.rust-target }}" --npm-platform "${{ inputs.npm-platform }}" --source-sha "${{ github.sha }}"
      - name: Upload immutable package set
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts-${{ inputs.rust-target }}-${{ github.sha }}
          path: target/artifact-smoke-release
          if-no-files-found: error
          retention-days: 7

  consume:
    name: Install and exercise downloaded packages
    needs: build
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Download package set produced by the build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts-${{ inputs.rust-target }}-${{ github.sha }}
          path: ${{ runner.temp }}/rookie-release-artifacts
      - name: Verify provenance, contents, installation, and Firefox extraction
        run: python tests/artifact_smoke/smoke_installed_artifacts.py --artifact-dir "${{ runner.temp }}/rookie-release-artifacts" --consumer-dir "${{ runner.temp }}/rookie artifact consumer 雪"
      - name: Record artifact identity
        if: always()
        shell: bash
        run: |
          {
            echo "### Native artifact smoke"
            echo "- target: \`${{ inputs.rust-target }}\`"
            echo "- runner: \`${{ inputs.runner }}\`"
            echo "- source: \`${{ github.sha }}\`"
            echo "- Actions artifact digest: \`${{ needs.build.outputs.artifact-digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
