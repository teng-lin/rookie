name: Reusable native artifact smoke

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub-hosted runner label
        required: true
        type: string
      rust-target:
        description: Native Rust target triple used by the CLI and Node binding
        required: true
        type: string
      python-target:
        description: Target name accepted by maturin-action
        required: true
        type: string
      npm-platform:
        description: napi-rs platform package directory
        required: true
        type: string
      cli-features:
        description: Extra Cargo feature arguments for the shipped CLI
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  # JavaScript actions run on Node 24. Trust certificates installed in the
  # hosted runner's system store when downloading maturin and other tools.
  NODE_OPTIONS: --use-system-ca

jobs:
  build:
    name: Build release packages
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev dbus
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ inputs.rust-target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: artifact-smoke-${{ inputs.rust-target }}
      - name: Build shipped CLI executable
        env:
          RUST_TARGET: ${{ inputs.rust-target }}
          CLI_FEATURES: ${{ inputs.cli-features }}
        shell: bash
        run: |
          feature_args=()
          if [[ -n "$CLI_FEATURES" ]]; then
            read -r -a feature_args <<< "$CLI_FEATURES"
          fi
          cargo build --release --target "$RUST_TARGET" --locked \
            --package rookie-cookies-cli --bin rookie-cookies "${feature_args[@]}"
      - name: Build Python wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ inputs.python-target }}
          args: --release --out dist --find-interpreter --locked
          sccache: true
          manylinux: auto
          working-directory: bindings/python
      - name: Install Node build dependencies
        working-directory: bindings/node
        run: |
          npm install --global npm@11.5.1
          npm ci
      - name: Build native Node binding on the runner
        if: runner.os != 'Linux' || runner.arch == 'ARM64'
        working-directory: bindings/node
        shell: bash
        env:
          RUST_TARGET: ${{ inputs.rust-target }}
        run: |
          # maturin-action with manylinux installs sccache inside Docker and
          # still exports RUSTC_WRAPPER=sccache into the host job env.
          if ! command -v sccache >/dev/null 2>&1; then
            unset RUSTC_WRAPPER SCCACHE_GHA_ENABLED
          fi
          case "$RUST_TARGET" in
            x86_64-unknown-linux-gnu|aarch64-unknown-linux-gnu|x86_64-pc-windows-msvc|aarch64-apple-darwin|x86_64-apple-darwin) ;;
            *) echo "unsupported rust-target: $RUST_TARGET" >&2; exit 1 ;;
          esac
          npm run build -- --target "$RUST_TARGET" -- --locked
      - name: Build native Node binding in the pinned release container
        if: runner.os == 'Linux' && runner.arch == 'X64'
        env:
          RUST_TARGET: ${{ inputs.rust-target }}
        shell: bash
        working-directory: bindings/node
        run: |
          mkdir -p .cargo-cache/git/db .cargo-cache/registry/cache .cargo-cache/registry/index
          node22_root="$(dirname "$(dirname "$(command -v node)")")"
          case "$(node --version)" in
            v22.*) ;;
            *) echo "Expected Node.js 22, found $(node --version)" >&2; exit 1 ;;
          esac
          # Mount the whole workspace root (not just rookie-rs/ + bindings/node/) so
          # cargo can see the workspace Cargo.toml, the committed Cargo.lock, and
          # every workspace member (cli/, bindings/python/) it needs to parse to
          # resolve the graph — `--locked` requires all of this to be visible.
          # Do not reuse artifacts from the host-side CLI build mounted at
          # /workspace/target; the smoke binding must be container-built.
          # The container builds as root, and `napi build` recreates index.js and
          # index.d.ts rather than truncating them, so both land root-owned in the
          # bind-mounted checkout. The packaging step below re-runs the same
          # generators as the unprivileged runner user, so hand ownership back
          # before leaving the container.
          docker run --rm --user 0:0 \
            -e ROOKIE_RUST_TARGET="$RUST_TARGET" \
            -e ROOKIE_HOST_UID="$(id -u)" \
            -e ROOKIE_HOST_GID="$(id -g)" \
            -e CARGO_TARGET_DIR=/tmp/rookie-target \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$GITHUB_WORKSPACE/bindings/node/.cargo-cache/git/db:/usr/local/cargo/git/db" \
            -v "$GITHUB_WORKSPACE/bindings/node/.cargo-cache/registry/cache:/usr/local/cargo/registry/cache" \
            -v "$GITHUB_WORKSPACE/bindings/node/.cargo-cache/registry/index:/usr/local/cargo/registry/index" \
            -v "$node22_root:/opt/node22:ro" \
            -w /workspace/bindings/node \
            ghcr.io/napi-rs/napi-rs/nodejs-rust@sha256:6f910fc8a723a1eeab2483d2302e8c1fabe36e54c51eb0da27fafd5c3083e08c \
            sh -lc '
              set -e
              export PATH=/opt/node22/bin:$PATH
              case "$(node --version)" in
                v22.*) ;;
                *) echo "Expected Node.js 22, found $(node --version)" >&2; exit 1 ;;
              esac
              export RUSTUP_HOME=/tmp/rookie-rustup
              export RUSTUP_TOOLCHAIN=stable
              rustup set auto-self-update disable
              rustup toolchain install stable --profile minimal
              npm run build -- --target "$ROOKIE_RUST_TARGET" -- --locked
              chown -R "$ROOKIE_HOST_UID:$ROOKIE_HOST_GID" /workspace/bindings/node
            '
      - name: Setup Node.js 24 packaging runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - name: Install pinned npm packaging tool
        run: npm install --global npm@11.5.1
      - name: Assemble release-shaped packages and provenance
        run: python tests/artifact_smoke/package_release_artifacts.py --target "${{ inputs.rust-target }}" --npm-platform "${{ inputs.npm-platform }}" --source-sha "${{ github.sha }}"
      - name: Upload immutable package set
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artifacts-${{ inputs.rust-target }}-${{ github.sha }}
          path: target/artifact-smoke-release
          if-no-files-found: error
          retention-days: 7

  consume:
    name: Install and exercise downloaded packages (Node.js ${{ matrix.node }})
    needs: build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Download package set produced by the build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-artifacts-${{ inputs.rust-target }}-${{ github.sha }}
          path: ${{ runner.temp }}/rookie-release-artifacts
      - name: Verify provenance, contents, installation, and Firefox extraction
        run: >-
          python tests/artifact_smoke/smoke_installed_artifacts.py
          --artifact-dir "${{ runner.temp }}/rookie-release-artifacts"
          --consumer-dir "${{ runner.temp }}/rookie artifact consumer 雪"
          --expected-source-sha "${{ github.sha }}"
          --expected-rust-target "${{ inputs.rust-target }}"
          --expected-npm-platform "${{ inputs.npm-platform }}"
          --expected-runner-os "${{ runner.os }}"
          --expected-runner-arch "${{ runner.arch }}"
      - name: Record artifact identity
        if: always()
        shell: bash
        run: |
          {
            echo "### Native artifact smoke"
            echo "- target: \`${{ inputs.rust-target }}\`"
            echo "- runner: \`${{ inputs.runner }}\`"
            echo "- Node.js: \`${{ matrix.node }}\`"
            echo "- source: \`${{ github.sha }}\`"
            echo "- Actions artifact digest: \`${{ needs.build.outputs.artifact-digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
