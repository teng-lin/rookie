name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish from the matching v-prefixed tag
        required: true
        type: string

env:
  DEBUG: napi:*
  APP_NAME: rookie_cookies
  MACOSX_DEPLOYMENT_TARGET: "10.13"
  RELEASE_VERSION: ${{ inputs.version }}

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

defaults:
  run:
    working-directory: ./bindings/node

jobs:
  preflight:
    name: Verify release metadata
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify release tag and metadata
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "v$RELEASE_VERSION"
          python scripts/check-release.py "$RELEASE_VERSION"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./bindings/node/package-lock.json
      - name: Verify npm package contents
        working-directory: ./bindings/node
        run: |
          npm ci --ignore-scripts
          npm pack --dry-run --ignore-scripts

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: npm run build -- --target x86_64-apple-darwin
          - host: windows-latest
            build: npm run build -- --target x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust@sha256:6f910fc8a723a1eeab2483d2302e8c1fabe36e54c51eb0da27fafd5c3083e08c
            build: npm run build -- --target x86_64-unknown-linux-gnu
          - host: macos-latest
            target: aarch64-apple-darwin
            build: npm run build -- --target aarch64-apple-darwin
    name: stable - ${{ matrix.settings.target }} - node@20
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ !matrix.settings.docker }}
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./bindings/node/package-lock.json
      - name: Install
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: ${{ !matrix.settings.docker }}
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}
      - name: Install dependencies
        run: npm ci

      - name: Build in docker
        if: ${{ matrix.settings.docker }}
        shell: bash
        run: |
          mkdir -p .cargo-cache/git/db .cargo-cache/registry/cache .cargo-cache/registry/index
          docker run --rm --user 0:0 \
            -v "$GITHUB_WORKSPACE/rookie-rs:/rookie-rs" \
            -v "$GITHUB_WORKSPACE/bindings/node/.cargo-cache/git/db:/usr/local/cargo/git/db" \
            -v "$GITHUB_WORKSPACE/bindings/node/.cargo-cache/registry/cache:/usr/local/cargo/registry/cache" \
            -v "$GITHUB_WORKSPACE/bindings/node/.cargo-cache/registry/index:/usr/local/cargo/registry/index" \
            -v "$GITHUB_WORKSPACE/bindings/node:/build" \
            -w /build \
            "${{ matrix.settings.docker }}" \
            sh -lc "${{ matrix.settings.build }}"
      - name: Build
        run: ${{ matrix.settings.build }}
        if: ${{ !matrix.settings.docker }}
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: ./**/${{ env.APP_NAME }}.*.node
          if-no-files-found: error
  test-macOS-windows-binding:
    name: Test bindings on ${{ matrix.settings.target }} - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
        node:
          - "18"
          - "20"
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ./bindings/node/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        run: npm test
  test-linux-x64-gnu-binding:
    name: Test bindings on Linux-x64-gnu - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        node:
          - "18"
          - "20"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ./bindings/node/package-lock.json
        env:
          DISABLE_V8_COMPILE_CACHE: 1
      - name: Install dependencies
        run: npm ci
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        run: docker run --rm -v $(pwd):/build -w /build node:${{ matrix.node }}-slim npm test
  package:
    name: Prepare immutable npm tarballs
    runs-on: ubuntu-latest
    needs:
      - build
      - test-macOS-windows-binding
      - test-linux-x64-gnu-binding
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./bindings/node/package-lock.json
        env:
          DISABLE_V8_COMPILE_CACHE: 1
      - name: Install dependencies
        run: |
          npm install --global npm@11.5.1
          npm ci --ignore-scripts
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ./bindings/node/artifacts
      - name: Move artifacts
        run: npm run artifacts
      - name: Verify native packages
        shell: bash
        run: |
          native_binaries=(
            npm/darwin-arm64/rookie_cookies.darwin-arm64.node
            npm/darwin-x64/rookie_cookies.darwin-x64.node
            npm/linux-x64-gnu/rookie_cookies.linux-x64-gnu.node
            npm/win32-x64-msvc/rookie_cookies.win32-x64-msvc.node
          )
          for binary in "${native_binaries[@]}"; do
            test -s "$binary"
          done
      - name: Pack release tarballs
        shell: bash
        run: |
          mkdir -p ../../release-packages/npm
          for package_directory in npm/*; do
            npm pack "$package_directory" --pack-destination ../../release-packages/npm --ignore-scripts
          done
          npm pack . --pack-destination ../../release-packages/npm --ignore-scripts
          test "$(find ../../release-packages/npm -maxdepth 1 -name '*.tgz' -type f | wc -l)" -eq 5
      - name: Upload release tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-release-${{ inputs.version }}
          path: release-packages/npm/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish rookie-cookies ${{ inputs.version }}
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/rookie-cookies/v/${{ inputs.version }}
    permissions:
      contents: read
      id-token: write
    needs: package
    steps:
      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Download release tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-release-${{ inputs.version }}
          path: ./bindings/node/release-packages
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1
      - name: Publish
        shell: bash
        run: |
          if test -n "$NPM_TOKEN"; then
            npm config set "//registry.npmjs.org/:_authToken" "$NPM_TOKEN" --location=user
          fi
          native_packages=(
            rookie-cookies-darwin-arm64
            rookie-cookies-darwin-x64
            rookie-cookies-linux-x64-gnu
            rookie-cookies-win32-x64-msvc
          )
          for package in "${native_packages[@]}"; do
            npm publish "release-packages/$package-$RELEASE_VERSION.tgz" \
              --access public --ignore-scripts --provenance
          done
          npm publish "release-packages/rookie-cookies-$RELEASE_VERSION.tgz" \
            --access public --ignore-scripts --provenance
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
