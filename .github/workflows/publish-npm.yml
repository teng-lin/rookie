name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish from the matching v-prefixed tag
        required: true
        type: string

env:
  DEBUG: napi:*
  APP_NAME: rookie_cookies
  MACOSX_DEPLOYMENT_TARGET: "10.13"
  RELEASE_VERSION: ${{ inputs.version }}

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

defaults:
  run:
    working-directory: ./bindings/node

jobs:
  preflight:
    name: Verify release metadata
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify release tag and metadata
        id: release
        run: |
          set -euo pipefail
          # $GITHUB_REF_TYPE/$GITHUB_REF_NAME reflect the ref that triggered
          # this workflow_dispatch (i.e. the branch selected in the Actions
          # UI), not the `ref:` override passed to actions/checkout above —
          # this guards against dispatching from anything but `main`.
          test "$GITHUB_REF_TYPE" = "branch"
          test "$GITHUB_REF_NAME" = "main"
          # NOTE: the checkout step above already checks out
          # `refs/tags/v$RELEASE_VERSION`, so comparing `HEAD` to that same
          # tag (`git rev-parse HEAD` vs `git rev-parse "v$RELEASE_VERSION^{}"`)
          # would be a tautology that can never fail and proves nothing about
          # whether the tag was actually reviewed and merged into `main`.
          # `fetch-depth: 0` above fetches full history for all branches, so
          # `origin/main` is available here; assert real ancestry instead.
          release_sha="$(git rev-parse "v$RELEASE_VERSION^{}")"
          test "$(git rev-parse HEAD)" = "$release_sha"
          git merge-base --is-ancestor "$release_sha" origin/main
          python scripts/check-release.py "$RELEASE_VERSION"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./bindings/node/package-lock.json
      - name: Verify npm package contents
        working-directory: ./bindings/node
        run: |
          npm ci --ignore-scripts
          npm pack --dry-run --ignore-scripts --json | tee /tmp/npm-pack-root.json
          node -e "
            const packed = require('/tmp/npm-pack-root.json');
            const files = packed[0].files.map((entry) => entry.path);
            if (!files.includes('MIT-LICENSE.txt')) {
              throw new Error('MIT-LICENSE.txt is missing from the root npm package: ' + files.join(', '));
            }
          "

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: npm run build -- --target x86_64-apple-darwin --cargo-flags=--locked
          - host: windows-latest
            build: npm run build -- --target x86_64-pc-windows-msvc --cargo-flags=--locked
            target: x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust@sha256:6f910fc8a723a1eeab2483d2302e8c1fabe36e54c51eb0da27fafd5c3083e08c
            build: npm run build -- --target x86_64-unknown-linux-gnu --cargo-flags=--locked
          - host: macos-latest
            target: aarch64-apple-darwin
            build: npm run build -- --target aarch64-apple-darwin --cargo-flags=--locked
    name: stable - ${{ matrix.settings.target }} - node@22
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./bindings/node/package-lock.json
      - name: Install
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: ${{ !matrix.settings.docker }}
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}
      - name: Install dependencies
        run: npm ci

      - name: Build in docker
        if: ${{ matrix.settings.docker }}
        shell: bash
        run: |
          mkdir -p .cargo-cache/git/db .cargo-cache/registry/cache .cargo-cache/registry/index
          node22_root="$(dirname "$(dirname "$(command -v node)")")"
          case "$(node --version)" in
            v22.*) ;;
            *) echo "Expected Node.js 22, found $(node --version)" >&2; exit 1 ;;
          esac
          # Mount the whole workspace root (not just rookie-rs/ + bindings/node/) so
          # cargo can see the workspace Cargo.toml, the committed Cargo.lock, and
          # every workspace member (cli/, bindings/python/) it needs to parse to
          # resolve the graph — `--locked` requires all of this to be visible.
          docker run --rm --user 0:0 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$GITHUB_WORKSPACE/bindings/node/.cargo-cache/git/db:/usr/local/cargo/git/db" \
            -v "$GITHUB_WORKSPACE/bindings/node/.cargo-cache/registry/cache:/usr/local/cargo/registry/cache" \
            -v "$GITHUB_WORKSPACE/bindings/node/.cargo-cache/registry/index:/usr/local/cargo/registry/index" \
            -v "$node22_root:/opt/node22:ro" \
            -w /workspace/bindings/node \
            "${{ matrix.settings.docker }}" \
            sh -lc '
              export PATH=/opt/node22/bin:$PATH
              case "$(node --version)" in
                v22.*) ;;
                *) echo "Expected Node.js 22, found $(node --version)" >&2; exit 1 ;;
              esac
              export RUSTUP_HOME=/tmp/rookie-rustup
              export RUSTUP_TOOLCHAIN=stable
              rustup set auto-self-update disable
              rustup toolchain install stable --profile minimal
              ${{ matrix.settings.build }}
            '
      - name: Build
        run: ${{ matrix.settings.build }}
        if: ${{ !matrix.settings.docker }}
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: ./**/${{ env.APP_NAME }}.*.node
          if-no-files-found: error
  test-macOS-windows-binding:
    name: Test bindings on ${{ matrix.settings.target }} - node@${{ matrix.node }}
    needs:
      - preflight
      - build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
        node:
          - "22"
          - "24"
          - "26"
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ./bindings/node/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        run: npm test
  test-linux-x64-gnu-binding:
    name: Test bindings on Linux-x64-gnu - node@${{ matrix.node }}
    needs:
      - preflight
      - build
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22"
          - "24"
          - "26"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          persist-credentials: false
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        # The Node test suite also verifies repository-level README/docs and
        # JavaScript examples. Mount the complete checkout so those paths have
        # the same layout inside Docker as they do on the runner.
        run: >-
          docker run --rm
          -e npm_config_cache=/tmp/npm-cache
          -v "$GITHUB_WORKSPACE:/workspace"
          -w /workspace/bindings/node
          "node:${{ matrix.node }}-slim"
          sh -lc 'npm ci && npm test'
  package:
    name: Prepare immutable npm tarballs
    runs-on: ubuntu-latest
    needs:
      - preflight
      - build
      - test-macOS-windows-binding
      - test-linux-x64-gnu-binding
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./bindings/node/package-lock.json
        env:
          DISABLE_V8_COMPILE_CACHE: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm install --global npm@11.5.1
          npm ci --ignore-scripts
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ./bindings/node/artifacts
      - name: Move artifacts
        run: npm run artifacts
      - name: Verify native packages
        shell: bash
        run: |
          native_binaries=(
            npm/darwin-arm64/rookie_cookies.darwin-arm64.node
            npm/darwin-x64/rookie_cookies.darwin-x64.node
            npm/linux-x64-gnu/rookie_cookies.linux-x64-gnu.node
            npm/win32-x64-msvc/rookie_cookies.win32-x64-msvc.node
          )
          for binary in "${native_binaries[@]}"; do
            test -s "$binary"
          done
      - name: Pack release tarballs
        run: |
          python ../../scripts/package-npm-tarballs.py \
            --node-root . \
            --output ../../release-packages/npm
      - name: Verify license file is packaged in release tarballs
        shell: bash
        run: |
          set -euo pipefail
          for tarball in \
            "../../release-packages/npm/rookie-cookies-$RELEASE_VERSION.tgz" \
            "../../release-packages/npm/rookie-cookies-linux-x64-gnu-$RELEASE_VERSION.tgz"
          do
            tar -tzf "$tarball" | grep -qx "package/MIT-LICENSE.txt" \
              || { echo "MIT-LICENSE.txt missing from $tarball" >&2; exit 1; }
          done
      - name: Record release and Windows scan checksums
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
        run: |
          set -euo pipefail
          release_root="../../release-packages/npm"
          scan_dir="$release_root/scan"
          windows_binary="rookie_cookies.win32-x64-msvc.node"
          mkdir -p "$scan_dir"
          cp "npm/win32-x64-msvc/$windows_binary" "$scan_dir/$windows_binary"
          mapfile -t tarballs < <(find "$release_root" -maxdepth 1 -name '*.tgz' -type f | sort)
          test "${#tarballs[@]}" -eq 5
          python ../../scripts/write-release-scan-manifest.py \
            --version "$RELEASE_VERSION" \
            --source-sha "$RELEASE_SHA" \
            --root "$release_root" \
            --output "$scan_dir/release-scan-manifest.json" \
            "${tarballs[@]}" "$scan_dir/$windows_binary"
      - name: Upload release tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-release-${{ inputs.version }}
          path: release-packages/npm/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish rookie-cookies ${{ inputs.version }}
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/rookie-cookies/v/${{ inputs.version }}
    permissions:
      contents: read
      id-token: write
    needs:
      - preflight
      - package
    steps:
      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Download release tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-release-${{ inputs.version }}
          path: ./bindings/node/release-packages
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1
      - name: Verify publish inputs
        shell: bash
        run: |
          test "$(find release-packages -maxdepth 1 -name '*.tgz' -type f | wc -l)" -eq 5
          for tarball in release-packages/*.tgz; do
            npm publish "./$tarball" --dry-run --access public --ignore-scripts
          done
      - name: Re-verify release tag still points at the packaged commit
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION" \
            --jq '"\(.object.type) \(.object.sha)"')"
          object_type="${object% *}"
          object_sha="${object#* }"

          # Peel annotated tags without trusting a mutable local ref. Limit
          # the depth so malformed tag chains fail closed instead of looping.
          for _ in 1 2 3 4 5; do
            if test "$object_type" = commit; then
              break
            fi
            if test "$object_type" != tag; then
              echo "::error::v$RELEASE_VERSION resolves to unsupported object type '$object_type'"
              exit 1
            fi
            object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
              --jq '"\(.object.type) \(.object.sha)"')"
            object_type="${object% *}"
            object_sha="${object#* }"
          done

          if test "$object_type" != commit; then
            echo "::error::v$RELEASE_VERSION did not peel to a commit"
            exit 1
          fi
          if test "$object_sha" != "$EXPECTED_RELEASE_SHA"; then
            echo "::error::v$RELEASE_VERSION now resolves to $object_sha, but the packaged commit is $EXPECTED_RELEASE_SHA"
            exit 1
          fi
      - name: Publish
        shell: bash
        run: |
          native_packages=(
            rookie-cookies-darwin-arm64
            rookie-cookies-darwin-x64
            rookie-cookies-linux-x64-gnu
            rookie-cookies-win32-x64-msvc
          )
          publish_tarball() {
            package_name="$1"
            tarball="$2"
            test -f "$tarball"
            if published_integrity=$(npm view "$package_name@$RELEASE_VERSION" dist.integrity 2>/dev/null); then
              local_integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
              if test "$published_integrity" != "$local_integrity"; then
                echo "$package_name@$RELEASE_VERSION exists with different contents" >&2
                return 1
              fi
              echo "$package_name@$RELEASE_VERSION is already published with identical contents"
              return 0
            fi
            npm publish "./$tarball" --access public --ignore-scripts --provenance
          }
          for package in "${native_packages[@]}"; do
            publish_tarball "$package" "release-packages/$package-$RELEASE_VERSION.tgz"
          done
          publish_tarball rookie-cookies "release-packages/rookie-cookies-$RELEASE_VERSION.tgz"
