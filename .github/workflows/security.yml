name: Security assurance

on:
  schedule:
    - cron: '31 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv:
    name: osv dependency scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    permissions:
      actions: read
      contents: read
      # The pinned reusable workflow declares this permission and GitHub
      # rejects the call before starting unless the caller grants the ceiling.
      security-events: write
    with:
      scan-args: |-
        --recursive
        ./
      fail-on-vuln: true
      upload-sarif: true

  secrets:
    name: gitleaks history scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scope the history scan to the checked-out ref
        run: |
          set -euo pipefail
          # gitleaks-action supplies an explicit range for push and PR events,
          # but scheduled/workflow_dispatch scans use `git log --all`. A
          # depth-zero checkout fetches every remote branch, so an unmerged
          # branch finding can otherwise make main's nightly scan fail. HEAD
          # gets its own local scan ref before those tracking refs are removed,
          # retaining its complete ancestry even after a detached checkout;
          # tags remain as additional committed release roots.
          git update-ref refs/heads/gitleaks-scan "$GITHUB_SHA"
          git remote set-head origin --delete || true
          git for-each-ref --format='delete %(refname)' refs/remotes/origin \
            | git update-ref --stdin
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse refs/heads/gitleaks-scan)" = "$GITHUB_SHA"
      - name: Scan committed history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_VERSION: 8.30.0

  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - rust
          - javascript-typescript
          - python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: /language:${{ matrix.language }}

  release-gate:
    name: "release gate: security"
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs:
      - osv
      - secrets
      - codeql
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require dependency, history-secret, and CodeQL scans
        env:
          OSV: ${{ needs.osv.result }}
          SECRETS: ${{ needs.secrets.result }}
          CODEQL: ${{ needs.codeql.result }}
        run: |
          set -euo pipefail
          test "$OSV" = success
          test "$SECRETS" = success
          test "$CODEQL" = success
