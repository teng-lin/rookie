name: Lint rookie-cookies

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0 # This would add unnecessary bloat to the target folder, decreasing cache efficiency.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    # rustfmt output does not depend on the host OS, so one run covers all
    # three rather than three identical ones competing for queue slots.
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: install Rust stable and rustfmt
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Run cargo fmt
        run: cargo fmt --manifest-path Cargo.toml --all -- --check

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Verify cargo package
        run: |
          cargo package --manifest-path Cargo.toml -p rookie-cookies --locked --list > package_files.txt
          cat package_files.txt
          grep -q "^examples/simple.rs$" package_files.txt
          grep -q "^examples/from_path.rs$" package_files.txt
          grep -q "^examples/detailed_from_path.rs$" package_files.txt
