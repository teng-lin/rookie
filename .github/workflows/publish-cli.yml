name: Publish CLI

on:
  workflow_dispatch:
    inputs:
      tag:
        required: true

permissions:
  contents: read

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  # release/platform-contract.json is the one place the CLI's platform/target
  # list is spelled out now — see scripts/platform_contract.py. This job
  # reads it so publish-cli.yml never keeps its own copy to drift out of
  # sync with publish-npm.yml's and publish-py.yml's.
  load-contract:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: matrix
        run: |
          set -euo pipefail
          python3 scripts/platform_contract.py --validate
          echo "matrix=$(python3 scripts/platform_contract.py --emit-matrix cli)" >>"$GITHUB_OUTPUT"

  publish-cli:
    needs: load-contract
    permissions:
      contents: write
      # For write-ci-proof.py's actions/jobs and actions/runs reads -- see
      # the "Verify non-spoofable CI proof" step below.
      actions: read
    environment:
      name: release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.load-contract.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The commit the dispatch ref already resolved to. This is what
          # `actions/checkout` uses when given no `ref:` — it fetches
          # `github.sha` itself rather than re-resolving the ref name — so
          # stating it makes the existing pinning explicit and auditable here
          # rather than changing it.
          #
          # NOTE: this is deliberately NOT `ref: refs/tags/${{ inputs.tag }}`.
          # Overriding with the *input* would make the verification step below
          # a tautology (the bug in publish-npm.yml's original preflight —
          # don't reproduce it). `github.sha` is the dispatch ref's own commit,
          # so the ref-type and ref-name checks still catch a wrong-ref
          # dispatch.
          ref: ${{ github.sha }}
          fetch-depth: 0

      # Unlike the crate and PyPI workflows, which derive `v$VERSION` from a
      # version input, this one takes the tag verbatim — so the `v<version>`
      # shape has to be asserted rather than constructed. Matching the dispatch
      # ref alone is satisfied by *any* tag dispatched with its own name, and a
      # non-`v` tag falls outside the `v*` ruleset that keeps a release tag
      # immutable, which is what closes the tag-move window the re-check below
      # cannot cover.
      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag must be v<major>.<minor>.<patch>[-prerelease], got '$RELEASE_TAG'"
            exit 1
          fi
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "$RELEASE_TAG"
          release_sha="$(git rev-parse "$RELEASE_TAG^{}")"
          test "$release_sha" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$release_sha" origin/main
          echo "RELEASE_SHA=$release_sha" >>"$GITHUB_ENV"
        env:
          RELEASE_TAG: ${{ inputs.tag }}

      # shell: bash is required: the default Windows shell is pwsh, where
      # `$GITHUB_REPOSITORY` is an empty PowerShell variable rather than the
      # Actions environment variable bash expands. Without this, the Windows
      # matrix leg fails before it builds (see v0.6.0-alpha.3).
      - name: Verify live release controls
        shell: bash
        run: python3 scripts/check-release-controls.py --repo "$GITHUB_REPOSITORY" --commit-sha "$RELEASE_SHA"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Build
        run: cargo build ${{ matrix.args }} --target ${{ matrix.target }} --package rookie-cookies-cli --bin rookie-cookies --release --locked
        env:
          ROOKIE_COOKIES_SOURCE_SHA: ${{ env.RELEASE_SHA }}

      - name: Rename Unix
        run: mv target/${{ matrix.target }}/release/rookie-cookies rookie-cookies-cli-${{ matrix.target }}
        if: contains(matrix.platform, 'macos') || contains(matrix.platform, 'ubuntu')

      - name: Rename Windows
        run: Move-Item target/${{ matrix.target }}/release/rookie-cookies.exe rookie-cookies-cli-${{ matrix.target }}.exe
        if: contains(matrix.platform, 'windows')

      # `gh release upload` addresses a release by tag name, not by commit, so
      # the verified-tag binding only holds while the tag still resolves to the
      # commit this run built. Re-resolve it here and fail closed if it moved.
      #
      # Resolve through `git/ref/tags/...`, not `commits/<tag>`: the latter
      # takes an ambiguous ref, so a branch sharing the tag's name could answer
      # in its place — and a branch is not covered by the `v*` tag ruleset this
      # check leans on. An annotated tag resolves to a tag object, which has to
      # be peeled to reach the commit.
      - name: Re-verify release tag still points at the built commit
        shell: bash
        run: |
          set -euo pipefail

          resolve_tag_commit() {
            local object
            object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq '"\(.object.type) \(.object.sha)"')" || return 1
            if test "${object% *}" = "tag"; then
              gh api "repos/$GITHUB_REPOSITORY/git/tags/${object#* }" --jq .object.sha || return 1
            else
              printf '%s\n' "${object#* }"
            fi
          }

          # Retry only the lookup: a transient API failure here would otherwise
          # discard an already-finished cross-platform build. A tag that is
          # genuinely gone still fails closed, just three attempts later.
          tag_sha=""
          for attempt in 1 2 3; do
            if tag_sha="$(resolve_tag_commit)"; then
              break
            fi
            tag_sha=""
            test "$attempt" -eq 3 || sleep $((attempt * 5))
          done

          if test -z "$tag_sha"; then
            echo "::error::could not resolve $RELEASE_TAG after 3 attempts"
            exit 1
          fi
          if test "$tag_sha" != "$GITHUB_SHA"; then
            echo "::error::$RELEASE_TAG now resolves to $tag_sha, but this run built $GITHUB_SHA"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}

      # A per-leg manifest, not one combined across all four targets: unlike
      # publish-npm.yml, this job has no later aggregation stage to collect
      # every leg's artifact before writing one manifest — restructuring the
      # job graph to add one was judged higher-risk than the completeness
      # gained. See docs/releasing.md's "Publish CLI binaries" section.
      - name: Write scan manifest
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            artifact="rookie-cookies-cli-${{ matrix.target }}.exe"
          else
            artifact="rookie-cookies-cli-${{ matrix.target }}"
          fi
          contract_digest="$(python3 scripts/platform_contract.py --digest)"
          python3 scripts/write-release-scan-manifest.py \
            --version "${RELEASE_TAG#v}" \
            --source-sha "$RELEASE_SHA" \
            --controller-sha "$RELEASE_SHA" \
            --platform-contract-digest "$contract_digest" \
            --root "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/release-scan-manifest.json" \
            "$GITHUB_WORKSPACE/$artifact"
        env:
          RELEASE_TAG: ${{ inputs.tag }}

      - name: Upload scan manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-scan-manifest-${{ matrix.target }}
          path: release-scan-manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Run consumer harness against manifest-verified artifact
        run: |
          python3 scripts/run-consumer-harness.py \
            --manifest "$GITHUB_WORKSPACE/release-scan-manifest.json" \
            --artifacts-root "$GITHUB_WORKSPACE"
        shell: bash

      # Release-hardening program R5: resolve each required check to its exact
      # producing job/run rather than trusting a check-run name alone. This is
      # a blocking release gate; a missing or unverifiable proof fails closed.
      - name: Verify non-spoofable CI proof for this release commit
        run: |
          python3 scripts/write-ci-proof.py \
            --repo "$GITHUB_REPOSITORY" \
            --commit-sha "$RELEASE_SHA" \
            --manifest "$GITHUB_WORKSPACE/release-scan-manifest.json" \
            --output "$GITHUB_WORKSPACE/ci-proof.json"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

      # A separate upload, not folded into "Upload scan manifest" above:
      # ci-proof.json is written by the step just before this one, after
      # that upload already ran.
      - name: Upload CI proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-ci-proof-${{ matrix.target }}
          path: ci-proof.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Unix
        shell: bash
        run: |
          set -euo pipefail
          artifact="rookie-cookies-cli-${{ matrix.target }}"
          python3 scripts/write-sha256-sidecar.py "$artifact"
          shasum -a 256 -c "$artifact.sha256"
          gh release upload "$RELEASE_TAG" "$artifact" "$artifact.sha256"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        if: contains(matrix.platform, 'macos') || contains(matrix.platform, 'ubuntu')

      - name: Upload Windows
        shell: pwsh
        run: |
          $artifact = "rookie-cookies-cli-${{ matrix.target }}.exe"
          $checksum = "$artifact.sha256"
          python scripts/write-sha256-sidecar.py $artifact
          if ($LASTEXITCODE -ne 0) {
            throw "failed to write $checksum"
          }
          $expected = (Get-Content -Raw $checksum).Split(' ')[0]
          $actual = (Get-FileHash -Algorithm SHA256 $artifact).Hash.ToLowerInvariant()
          if ($expected -ne $actual) {
            throw "checksum verification failed for $artifact"
          }
          gh release upload "$env:RELEASE_TAG" $artifact $checksum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        if: contains(matrix.platform, 'windows')
