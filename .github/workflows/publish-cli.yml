name: Publish CLI

on:
  workflow_dispatch:
    inputs:
      tag:
        required: true

permissions:
  contents: read

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish-cli:
    permissions:
      contents: write
    environment:
      name: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            target: "aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs.
            target: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04" # Ubuntu 22.04 x86_64 (Works on 24.04 as well)
            target: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest" # Windows x86_64
            target: "x86_64-pc-windows-msvc"
            args: "--features appbound"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # NOTE: deliberately NO `ref:` override — this lets the checkout use
          # whatever ref actually triggered the dispatch, so the verification
          # step below can catch a wrong-ref dispatch instead of silently
          # "fixing" it into always checking out the named tag (that's the
          # tautology bug in publish-npm.yml's original preflight — don't
          # reproduce it).

      - name: Verify release tag
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.tag }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Build
        run: cargo build ${{ matrix.args }} --target ${{ matrix.target }} --package rookie-cookies-cli --bin rookie-cookies --release --locked

      - name: Rename Unix
        run: mv target/${{ matrix.target }}/release/rookie-cookies rookie-cookies-cli-${{ matrix.target }}
        if: contains(matrix.platform, 'macos') || contains(matrix.platform, 'ubuntu')

      - name: Rename Windows
        run: Move-Item target/${{ matrix.target }}/release/rookie-cookies.exe rookie-cookies-cli-${{ matrix.target }}.exe
        if: contains(matrix.platform, 'windows')

      - name: Upload Unix
        run: gh release upload "$RELEASE_TAG" rookie-cookies-cli-${{ matrix.target }} --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        if: contains(matrix.platform, 'macos') || contains(matrix.platform, 'ubuntu')

      - name: Upload Windows
        run: gh release upload "$env:RELEASE_TAG" rookie-cookies-cli-${{ matrix.target }}.exe --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        if: contains(matrix.platform, 'windows')
