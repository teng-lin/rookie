name: Publish CLI

on:
  workflow_dispatch:
    inputs:
      tag:
        required: true

permissions:
  contents: read

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish-cli:
    permissions:
      contents: write
    environment:
      name: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            target: "aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs.
            target: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04" # Ubuntu 22.04 x86_64 (Works on 24.04 as well)
            target: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest" # Windows x86_64
            target: "x86_64-pc-windows-msvc"
            args: "--features appbound"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Pin to the commit the dispatch ref already resolved to. Checking
          # out `refs/tags/...` by name re-fetches the tag at checkout time, so
          # a tag force-moved after dispatch would swap the source out from
          # under this run.
          #
          # NOTE: this is deliberately NOT `ref: refs/tags/${{ inputs.tag }}`.
          # Overriding with the *input* would make the verification step below
          # a tautology (the bug in publish-npm.yml's original preflight —
          # don't reproduce it). `github.sha` is the dispatch ref's own commit,
          # so the ref-type and ref-name checks still catch a wrong-ref
          # dispatch.
          ref: ${{ github.sha }}

      - name: Verify release tag
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.tag }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Build
        run: cargo build ${{ matrix.args }} --target ${{ matrix.target }} --package rookie-cookies-cli --bin rookie-cookies --release --locked

      - name: Rename Unix
        run: mv target/${{ matrix.target }}/release/rookie-cookies rookie-cookies-cli-${{ matrix.target }}
        if: contains(matrix.platform, 'macos') || contains(matrix.platform, 'ubuntu')

      - name: Rename Windows
        run: Move-Item target/${{ matrix.target }}/release/rookie-cookies.exe rookie-cookies-cli-${{ matrix.target }}.exe
        if: contains(matrix.platform, 'windows')

      # `gh release upload` addresses a release by tag name, not by commit, so
      # the verified-tag binding only holds while the tag still resolves to the
      # commit this run built. Re-resolve it here and fail closed if it moved.
      - name: Re-verify release tag still points at the built commit
        shell: bash
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          if test "$tag_sha" != "$GITHUB_SHA"; then
            echo "::error::$RELEASE_TAG now resolves to $tag_sha, but this run built $GITHUB_SHA"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}

      - name: Upload Unix
        run: gh release upload "$RELEASE_TAG" rookie-cookies-cli-${{ matrix.target }} --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        if: contains(matrix.platform, 'macos') || contains(matrix.platform, 'ubuntu')

      - name: Upload Windows
        run: gh release upload "$env:RELEASE_TAG" rookie-cookies-cli-${{ matrix.target }}.exe --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        if: contains(matrix.platform, 'windows')
