name: Test rookie-cookies

on:
  pull_request:
    paths:
      - '.github/workflows/publish-*.yml'
      - '.github/workflows/test-rust.yml'
      - 'rookie-rs/**'
      - 'cli/**'
      - 'bindings/python/**'
      - 'bindings/node/**'
      - 'tests/python/**'
      - 'tests/e2e/assert_cli_cookie.py'
      - 'tests/e2e/test_assert_cli_cookie.py'
      - 'examples/javascript/package-lock.json'
      - 'examples/rust/http/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'CHANGELOG.md'
      - 'docs/RELEASING.md'
      - 'scripts/check-public-api.py'
      - 'scripts/check-release.py'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  # JavaScript actions run on Node 24. Trust certificates installed in the
  # hosted runner's system store when downloading maturin and other tools.
  NODE_OPTIONS: --use-system-ca

jobs:
  release-metadata:
    name: release metadata consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check release metadata
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("rookie-rs/Cargo.toml", "rb"))["package"]["version"])')
          python scripts/check-release.py "$version"
      - name: Test portable CLI assertion helper
        run: python -m unittest tests/e2e/test_assert_cli_cookie.py -v

  cargo-test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Linux packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev dbus at-spi2-core
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test -p rookie-cookies --no-default-features --all-targets --locked
      - run: cargo test --workspace --doc --locked

  cargo-audit:
    name: cargo audit (advisory report, non-blocking)
    runs-on: ubuntu-latest
    # Informational only: reports known RustSec advisories against the
    # committed Cargo.lock without gating merges. As of this PR it legitimately
    # reports findings (the pyo3 advisories tracked in #107) until that upgrade
    # lands — surfacing them truthfully is the point of this job, not enforcing
    # a clean bill of health today. Once #107 lands, consider dropping
    # `continue-on-error` to make this a required check.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Run cargo audit
        run: cargo audit

  public-api:
    name: public API (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            enforce: true
          - os: macos-latest
            platform: macos
            enforce: true
          - os: windows-latest
            platform: windows
            enforce: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Linux cargo-public-api dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libssl-dev pkg-config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # cargo-public-api 0.52.0 --locked consumes rustdoc format 57 despite
      # advertising an older format-55 minimum; this is the tested compatible nightly.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly-2025-11-23
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install pinned cargo-public-api
        run: cargo install cargo-public-api --version 0.52.0 --locked
      - name: Enforce committed public API snapshots
        if: matrix.enforce
        run: python scripts/check-public-api.py --platform ${{ matrix.platform }}
      - name: Bootstrap native public API snapshots
        if: ${{ !matrix.enforce }}
        run: python scripts/check-public-api.py --platform ${{ matrix.platform }} --bootstrap --output-dir target/public-api
      - name: Upload native snapshot candidates
        if: ${{ !matrix.enforce }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-api-${{ matrix.platform }}
          path: target/public-api/${{ matrix.platform }}-*.txt
          if-no-files-found: error

  node-test:
    name: node test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Linux packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev dbus at-spi2-core
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install node deps
        working-directory: bindings/node
        run: npm install
      - name: Build node binding
        working-directory: bindings/node
        run: npm run build:test -- --cargo-flags=--locked
      - name: Test native worker panic rejection
        working-directory: bindings/node
        run: npm run test:worker-panic
      - name: Run ava
        working-directory: bindings/node
        run: npm test

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64]
    steps:
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev dbus at-spi2-core
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --locked
          sccache: 'true'
          manylinux: auto
          working-directory: bindings/python

  python-tests:
    name: Python module tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev dbus at-spi2-core
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install Python module
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '1'
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet maturin
          cd bindings/python
          ../../.venv/bin/maturin develop --release --locked
      - name: Run Python unit tests
        run: .venv/bin/python -m unittest discover -s tests/python -p 'test_*.py' -v

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          architecture: ${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --locked
          working-directory: bindings/python
          sccache: 'true'

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --locked
          working-directory: bindings/python
          sccache: 'true'

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist
          working-directory: bindings/python
