name: Test rookie-cookies

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Full Node/Python version matrix, FreeBSD, and packaging wheels.
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: PR-sized suite, or the full nightly language matrix
        type: choice
        options:
          - pr
          - nightly
        default: nightly

permissions:
  contents: read

env:
  # JavaScript actions run on Node 24. Trust certificates installed in the
  # hosted runner's system store when downloading maturin and other tools.
  NODE_OPTIONS: --use-system-ca

jobs:
  decide:
    name: decide suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      nightly: ${{ steps.decide.outputs.nightly }}
      node_matrix: ${{ steps.decide.outputs.node_matrix }}
      python_matrix: ${{ steps.decide.outputs.python_matrix }}
    steps:
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          SUITE: ${{ inputs.suite || '' }}
        run: |
          set -euo pipefail
          nightly=false
          case "$EVENT_NAME" in
            schedule) nightly=true ;;
            workflow_dispatch)
              if [ "$SUITE" = "nightly" ]; then nightly=true; fi
              ;;
          esac
          echo "nightly=$nightly" >> "$GITHUB_OUTPUT"
          if [ "$nightly" = true ]; then
            echo 'node_matrix=[{"os":"ubuntu-latest","node":"22"},{"os":"ubuntu-latest","node":"24"},{"os":"ubuntu-latest","node":"26"},{"os":"macos-latest","node":"22"},{"os":"macos-latest","node":"24"},{"os":"macos-latest","node":"26"},{"os":"windows-latest","node":"22"},{"os":"windows-latest","node":"24"},{"os":"windows-latest","node":"26"}]' >> "$GITHUB_OUTPUT"
            echo 'python_matrix=[{"os":"ubuntu-latest","python":"3.11"},{"os":"ubuntu-latest","python":"3.12"},{"os":"ubuntu-latest","python":"3.13"},{"os":"ubuntu-latest","python":"3.14"},{"os":"macos-latest","python":"3.11"},{"os":"macos-latest","python":"3.12"},{"os":"macos-latest","python":"3.13"},{"os":"macos-latest","python":"3.14"},{"os":"windows-latest","python":"3.11"},{"os":"windows-latest","python":"3.12"},{"os":"windows-latest","python":"3.13"},{"os":"windows-latest","python":"3.14"}]' >> "$GITHUB_OUTPUT"
          else
            # One Node and one CPython per OS, staggered so a PR still
            # compiles and tests every supported runtime without the 3×N product.
            echo 'node_matrix=[{"os":"ubuntu-latest","node":"22"},{"os":"macos-latest","node":"24"},{"os":"windows-latest","node":"26"}]' >> "$GITHUB_OUTPUT"
            echo 'python_matrix=[{"os":"ubuntu-latest","python":"3.12"},{"os":"macos-latest","python":"3.13"},{"os":"windows-latest","python":"3.14"}]' >> "$GITHUB_OUTPUT"
          fi

  check:
    # One job per OS: rustfmt/package/metadata/audit on Ubuntu only;
    # Clippy, cargo test, and public-API snapshots on all three.
    # Steps after the first gate use `!cancelled()` so one failure cannot
    # hide the next.
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # check-release.py's SemVer-floor check reads `git tag --list 'v*'`.
          # A shallow checkout would silently skip the downgrade check.
          fetch-depth: 0
          persist-credentials: false
      - name: Install Linux packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libdbus-1-dev dbus at-spi2-core libssl-dev pkg-config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Install nightly first so the subsequent stable install remains the
      # default for fmt/clippy/test. check-public-api.py selects nightly
      # with `cargo +nightly-2025-11-23`.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly-2025-11-23
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .

      - name: Run cargo fmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --manifest-path Cargo.toml --all -- --check
      - name: Verify cargo package
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: |
          cargo package --manifest-path Cargo.toml -p rookie-cookies --locked --list > package_files.txt
          cat package_files.txt
          grep -q "^examples/simple.rs$" package_files.txt
          grep -q "^examples/from_path.rs$" package_files.txt
          grep -q "^examples/detailed_from_path.rs$" package_files.txt
          grep -q "^browser_registry.json$" package_files.txt
      - name: Enforce authoritative browser discovery
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: |
          test ! -e rookie-rs/config.json
          test ! -e rookie-rs/src/common/paths.rs
          if rg -n 'common::paths|paths::find_[a-z_]+_paths' rookie-rs/src; then
            echo 'legacy browser discovery call site found' >&2
            exit 1
          fi
      - name: Validate platform contract
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: python scripts/platform_contract.py --validate
      - name: Check native execution coverage
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: python scripts/run-consumer-harness.py --check-native-coverage
      - name: Check release metadata
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: python scripts/check-release.py
      - name: Test release tooling
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: python -m unittest discover -s tests/release -p 'test_*.py' -v
      - name: Test E2E Python helpers
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: python -m unittest discover -s tests/e2e -p 'test_*.py' -v
      - name: Install cargo-audit
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Run cargo audit against exceptions
        # Blocking: every RustSec advisory against Cargo.lock must have a
        # matching, unexpired entry in security/audit-exceptions.toml.
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: python scripts/check-audit-exceptions.py

      - name: Run Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test workspace
        if: ${{ !cancelled() }}
        run: cargo test --workspace --all-targets --locked
      - name: Test without default features
        if: ${{ !cancelled() }}
        run: cargo test -p rookie-cookies --no-default-features --all-targets --locked
      - name: Enforce producer identifier validation in release builds
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: cargo test -p rookie-cookies --release --locked crate_produced_identifiers_reject_invalid_values
      - name: Test documentation
        if: ${{ !cancelled() }}
        run: cargo test --workspace --doc --locked
      - name: Deny rustdoc warnings
        if: ${{ !cancelled() }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p rookie-cookies --all-features --no-deps --locked
      - name: Check packaged Rust consumer resolution
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: python scripts/check-packaged-rust-consumer.py
      - name: Check DTO schema and generated DTOs are current
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: |
          cargo run --manifest-path rookie-rs/Cargo.toml --bin generate-dto-schema --features dto-schema -- schema/report-dto.schema.json
          python scripts/generate-python-dto.py
          git diff --exit-code schema/report-dto.schema.json bindings/python/rookie_cookies/dto.py
      - name: Check platform cfg locations
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: cargo run -p xtask --locked -- check-cfg-locations
      - name: Check stage boundary
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: cargo run -p xtask --locked -- check-stage-boundary
      - name: Install pinned cargo-public-api
        if: ${{ !cancelled() }}
        run: cargo install cargo-public-api --version 0.52.0 --locked
      - name: Enforce committed public API snapshots
        if: ${{ !cancelled() }}
        run: python scripts/check-public-api.py --platform ${{ matrix.platform }}

  freebsd-native:
    name: native FreeBSD direct-path API
    needs: decide
    if: needs.decide.outputs.nightly == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test inside a real FreeBSD VM
        uses: vmactions/freebsd-vm@83b151f58c6047089f4c80eb5ba2039d158ce093 # v1.5.3
        with:
          release: '14.3'
          usesh: true
          prepare: pkg install -y rust pkgconf sqlite3
          run: |
            set -eu
            freebsd-version
            uname -a
            rustc -vV
            cargo -V
            cargo test -p rookie-cookies --all-targets --all-features --locked --no-run
            cargo test -p rookie-cookies --all-targets --no-default-features --locked --no-run
            cargo check -p rookie-cookies-cli --bin rookie-cookies --locked
            cargo build -p rookie-cookies-cli --bin rookie-cookies --locked
            fixture_dir=$(mktemp -d)
            mozilla_db="$fixture_dir/cookies.sqlite"
            sqlite3 "$mozilla_db" <<'SQL'
            CREATE TABLE moz_cookies (
              host TEXT NOT NULL, path TEXT NOT NULL, isSecure INTEGER NOT NULL,
              expiry INTEGER NOT NULL, name TEXT NOT NULL, value TEXT NOT NULL,
              isHttpOnly INTEGER NOT NULL, sameSite INTEGER NOT NULL
            );
            INSERT INTO moz_cookies VALUES
              ('.example.test', '/', 1, 0, 'freebsd_cli', 'portable', 1, 0);
            SQL
            target/debug/rookie-cookies --path "$mozilla_db" --domains example.test \
              > "$fixture_dir/mozilla.json"
            grep '"name": "freebsd_cli"' "$fixture_dir/mozilla.json"
            grep '"value": "portable"' "$fixture_dir/mozilla.json"

            chromium_db="$fixture_dir/Cookies"
            sqlite3 "$chromium_db" 'CREATE TABLE cookies (name TEXT);'
            status=0
            target/debug/rookie-cookies --path "$chromium_db" \
              > "$fixture_dir/chromium.out" 2> "$fixture_dir/chromium.err" \
              || status=$?
            test "$status" -eq 1
            test ! -s "$fixture_dir/chromium.out"
            grep 'chromium_sqlite extraction is unsupported on freebsd/' \
              "$fixture_dir/chromium.err"
            target/debug/rookie-cookies --help > "$fixture_dir/help.txt"
            ! grep -q 'allow-process-shutdown' "$fixture_dir/help.txt"
            cargo test -p rookie-cookies --all-features --locked --lib \
              direct_path::shared::
            cargo test -p rookie-cookies --no-default-features --locked --lib \
              direct_path::shared::
            cargo test -p rookie-cookies --all-features --locked --lib \
              direct_path::tests::mozilla_direct_path_is_available_on_every_compile_target -- --exact
            cargo test -p rookie-cookies --no-default-features --locked --lib \
              direct_path::tests::mozilla_direct_path_is_available_on_every_compile_target -- --exact
            cargo test -p rookie-cookies --all-features --locked --lib \
              direct_path::tests::unsupported_target_accessors_are_stable -- --exact
            cargo test -p rookie-cookies --no-default-features --locked --lib \
              direct_path::tests::unsupported_target_accessors_are_stable -- --exact
            cargo test -p rookie-cookies --all-features --locked --lib \
              compatibility_dispatch::
            cargo test -p rookie-cookies --no-default-features --locked --lib \
              compatibility_dispatch::
            cargo test -p rookie-cookies --all-features --locked --lib \
              browser::legacy::dispatch::
            cargo test -p rookie-cookies --no-default-features --locked --lib \
              browser::legacy::dispatch::
            cargo test -p rookie-cookies --all-features --locked --lib \
              browser::report_build::dispatch::
            cargo test -p rookie-cookies --no-default-features --locked --lib \
              browser::report_build::dispatch::
            cargo test -p rookie-cookies --all-features --locked --lib \
              config::tests::unsupported_target_never_borrows_linux_compatibility_config -- --exact
            cargo test -p rookie-cookies --all-features --locked --test public_contract direct_path_
            cargo run --manifest-path tests/direct_path_consumer/Cargo.toml

  node-tests:
    # Native addon: one build per (OS, Node.js) cell, then the ava +
    # worker-panic + examples suite. Pull requests stagger versions
    # across OSes; nightly is the full 3 × {22, 24, 26} product.
    name: Node.js build and tests (${{ matrix.os }}, Node.js ${{ matrix.node }})
    needs: decide
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.decide.outputs.node_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Linux packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev dbus at-spi2-core
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - name: Install node deps
        working-directory: bindings/node
        run: npm ci
      - name: Build node binding
        working-directory: bindings/node
        run: npm run build:test -- --cargo-flags=--locked
      - name: Verify committed loader matches freshly patched output
        # `npm run build:test` re-runs scripts/patch-loader.js (via the
        # `postbuild:test` hook) against the napi-generated index.js/index.d.ts.
        # Both files are committed to the repo, so if patch-loader.js's
        # regex-based replacements ever stop matching napi-rs's generated
        # shape, this diff catches the resulting stale/broken loader instead
        # of letting CI stay green.
        working-directory: bindings/node
        run: git diff --exit-code index.js index.d.ts
      - name: Test native worker panic rejection
        working-directory: bindings/node
        run: npm run test:worker-panic
      - name: Typecheck index.d.ts
        working-directory: bindings/node
        run: npm run typecheck
      - name: Run ava
        working-directory: bindings/node
        run: npm test
      - name: Test JavaScript examples
        working-directory: examples/javascript
        run: npm test

  python-tests:
    # abi3-py311 wheel: one build per (OS, interpreter) cell, then the
    # tests/python suite. Pull requests stagger versions across OSes;
    # nightly is the full 3 × {3.11–3.14} product.
    name: Python build and tests (${{ matrix.os }}, ${{ matrix.python }})
    needs: decide
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.decide.outputs.python_matrix) }}
    steps:
      - name: Install Linux packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev dbus at-spi2-core
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build the abi3 wheel and run the suite
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '1'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet maturin==1.14.1
          python -m maturin build --release --locked --out dist --manifest-path bindings/python/Cargo.toml
          wheel=$(ls dist/*.whl)
          echo "Testing $wheel on $(python --version)"
          python -m venv .venv
          if [ -x .venv/bin/python ]; then
            py=.venv/bin/python
          else
            py=.venv/Scripts/python
          fi
          "$py" -m pip install --quiet "$wheel"
          "$py" -m unittest discover -s tests/python -p 'test_*.py' -v

  linux:
    name: manylinux Python wheel
    needs: decide
    if: needs.decide.outputs.nightly == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64]
    steps:
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev dbus at-spi2-core
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --locked
          sccache: 'true'
          manylinux: auto
          working-directory: bindings/python

  windows:
    name: Windows Python wheel
    needs: decide
    if: needs.decide.outputs.nightly == 'true'
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --locked
          working-directory: bindings/python
          sccache: 'true'

  macos:
    name: macOS Intel Python wheel
    needs: decide
    if: needs.decide.outputs.nightly == 'true'
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --locked
          working-directory: bindings/python
          sccache: 'true'

  sdist:
    name: Python sdist
    needs: decide
    if: needs.decide.outputs.nightly == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install maturin
        run: python -m pip install --disable-pip-version-check --quiet maturin==1.14.1
      - name: Build sdist
        working-directory: bindings/python
        run: python -m maturin sdist --out dist
