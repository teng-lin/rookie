name: Publish Crate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish from the matching v-prefixed tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-crate
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  release:
    name: Publish rookie-cookies ${{ inputs.version }}
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://crates.io/crates/rookie-cookies/${{ inputs.version }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Verify release tag and metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "v$RELEASE_VERSION"
          release_sha="$(git rev-parse "v$RELEASE_VERSION^{}")"
          test "$release_sha" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$release_sha" origin/main
          python scripts/check-release.py "$RELEASE_VERSION"
          echo "RELEASE_SHA=$release_sha" >>"$GITHUB_ENV"

      - name: Verify live release controls
        run: python3 scripts/check-release-controls.py --repo "$GITHUB_REPOSITORY" --commit-sha "$RELEASE_SHA"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build and verify crate package
        shell: bash
        run: |
          set -euo pipefail
          cargo package --locked -p rookie-cookies
          cargo publish --dry-run --locked -p rookie-cookies --features appbound
          mkdir -p release-packages/crate
          cp \
            "target/package/rookie-cookies-$RELEASE_VERSION.crate" \
            release-packages/crate/
        env:
          ROOKIE_COOKIES_SOURCE_SHA: ${{ env.RELEASE_SHA }}

      - name: Write crate scan manifest
        shell: bash
        run: |
          set -euo pipefail
          contract_digest="$(python3 scripts/platform_contract.py --digest)"
          python3 scripts/write-release-scan-manifest.py \
            --version "$RELEASE_VERSION" \
            --source-sha "$RELEASE_SHA" \
            --controller-sha "$GITHUB_SHA" \
            --platform-contract-digest "$contract_digest" \
            --root "$GITHUB_WORKSPACE" \
            --output release-packages/crate/release-scan-manifest.json \
            "release-packages/crate/rookie-cookies-$RELEASE_VERSION.crate"

      - name: Run consumer harness against manifest-verified crate
        run: |
          python3 scripts/run-consumer-harness.py \
            --manifest release-packages/crate/release-scan-manifest.json \
            --artifacts-root "$GITHUB_WORKSPACE"

      - name: Verify non-spoofable CI proof for this release commit
        run: |
          python3 scripts/write-ci-proof.py \
            --repo "$GITHUB_REPOSITORY" \
            --commit-sha "$RELEASE_SHA" \
            --manifest release-packages/crate/release-scan-manifest.json \
            --output release-packages/crate/ci-proof.json
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload crate release proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crate-release-${{ inputs.version }}
          path: release-packages/crate/
          if-no-files-found: error
          retention-days: 7

      - name: Publish crate
        run: cargo publish --locked -p rookie-cookies --features appbound
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          ROOKIE_COOKIES_SOURCE_SHA: ${{ env.RELEASE_SHA }}
