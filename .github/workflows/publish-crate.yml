name: Publish Crate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish from the matching v-prefixed tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-crate
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  release:
    name: Publish rookie-cookies ${{ inputs.version }}
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://crates.io/crates/rookie-cookies/${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Verify release tag and metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "v$RELEASE_VERSION"
          release_sha="$(git rev-parse "v$RELEASE_VERSION^{}")"
          test "$release_sha" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$release_sha" origin/main
          python scripts/check-release.py "$RELEASE_VERSION"
          echo "RELEASE_SHA=$release_sha" >>"$GITHUB_ENV"

      - name: Verify live release controls
        run: python3 scripts/check-release-controls.py --repo "$GITHUB_REPOSITORY" --commit-sha "$RELEASE_SHA"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify crate package
        run: cargo publish --dry-run --locked -p rookie-cookies --features appbound
        env:
          ROOKIE_COOKIES_SOURCE_SHA: ${{ env.RELEASE_SHA }}

      - name: Publish crate
        run: cargo publish --locked -p rookie-cookies --features appbound
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          ROOKIE_COOKIES_SOURCE_SHA: ${{ env.RELEASE_SHA }}
