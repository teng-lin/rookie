name: Publish PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish from the matching v-prefixed tag
        required: true
        type: string
      recovery_run_id:
        description: Failed publish-py.yml run ID whose exact artifacts should be resumed
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

env:
  # JavaScript actions run on Node 24. Trust certificates installed in the
  # hosted runner's system store when downloading maturin and other tools.
  NODE_OPTIONS: --use-system-ca
  RELEASE_VERSION: ${{ inputs.version }}
  # publish-py.yml is dispatched from the `v$VERSION` tag itself (see
  # docs/releasing.md), so `github.sha` already is the verified release
  # commit in every job here — no need to thread it through job outputs the
  # way publish-npm.yml (dispatched from `main`) has to.
  ROOKIE_COOKIES_SOURCE_SHA: ${{ github.sha }}

jobs:
  preflight:
    name: Verify release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify release tag and metadata
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "v$RELEASE_VERSION"
          release_sha="$(git rev-parse "v$RELEASE_VERSION^{}")"
          test "$release_sha" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$release_sha" origin/main
          python scripts/check-release.py "$RELEASE_VERSION"
      - name: Verify live release controls
        run: python3 scripts/check-release-controls.py --repo "$GITHUB_REPOSITORY" --commit-sha "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}

  # release/platform-contract.json is the one place the wheel target lists
  # are spelled out now — see scripts/platform_contract.py.
  load-contract:
    if: inputs.recovery_run_id == ''
    runs-on: ubuntu-latest
    outputs:
      linux_matrix: ${{ steps.matrix.outputs.linux_matrix }}
      windows_matrix: ${{ steps.matrix.outputs.windows_matrix }}
      macos_matrix: ${{ steps.matrix.outputs.macos_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: matrix
        run: |
          set -euo pipefail
          python3 scripts/platform_contract.py --validate
          echo "linux_matrix=$(python3 scripts/platform_contract.py --emit-matrix wheel-linux)" >>"$GITHUB_OUTPUT"
          echo "windows_matrix=$(python3 scripts/platform_contract.py --emit-matrix wheel-win32)" >>"$GITHUB_OUTPUT"
          echo "macos_matrix=$(python3 scripts/platform_contract.py --emit-matrix wheel-darwin)" >>"$GITHUB_OUTPUT"

  linux:
    if: inputs.recovery_run_id == ''
    name: Build Linux wheel (${{ matrix.target }})
    needs: [preflight, load-contract]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.load-contract.outputs.linux_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --locked
          sccache: true
          manylinux: auto
          working-directory: bindings/python
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-linux-${{ matrix.target }}
          path: bindings/python/dist
          if-no-files-found: error
          retention-days: 30

  windows:
    if: inputs.recovery_run_id == ''
    name: Build Windows wheel (${{ matrix.target }})
    needs: [preflight, load-contract]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.load-contract.outputs.windows_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.target }}
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --locked
          working-directory: bindings/python
          sccache: true
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-windows-${{ matrix.target }}
          path: bindings/python/dist
          if-no-files-found: error
          retention-days: 30

  macos:
    if: inputs.recovery_run_id == ''
    name: Build macOS wheel (${{ matrix.target }})
    needs: [preflight, load-contract]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.load-contract.outputs.macos_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --locked
          working-directory: bindings/python
          sccache: true
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-macos-${{ matrix.target }}
          path: bindings/python/dist
          if-no-files-found: error
          retention-days: 30

  sdist:
    if: inputs.recovery_run_id == ''
    name: Build source distribution
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install maturin
        run: python -m pip install --disable-pip-version-check --quiet maturin==1.14.1
      - name: Build source distribution
        working-directory: bindings/python
        run: python -m maturin sdist --out dist
      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-sdist
          path: bindings/python/dist
          if-no-files-found: error
          retention-days: 30

  release:
    if: inputs.recovery_run_id == ''
    name: Publish rookie-cookies ${{ inputs.version }}
    needs: [linux, windows, macos, sdist]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/rookie-cookies/${{ inputs.version }}/
    permissions:
      contents: read
      id-token: write
      # For write-ci-proof.py's actions/jobs and actions/runs reads -- see
      # the "Verify non-spoofable CI proof" step below.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # run-consumer-harness.py's exercise_python_wheel installs the cp311-abi3
      # wheel into a venv built from sys.executable -- pin the same version
      # every other job in this workflow uses, rather than trusting whatever
      # python3 the runner image happens to ship, which could be older than
      # 3.11 and make pip reject the wheel on ABI/version grounds.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - name: List distributions
        run: find dist -maxdepth 1 -type f -print
      - name: Write scan manifest
        shell: bash
        run: |
          set -euo pipefail
          contract_digest="$(python3 scripts/platform_contract.py --digest)"
          mapfile -t distributions < <(find dist -maxdepth 1 -type f | sort)
          test "${#distributions[@]}" -gt 0
          python3 scripts/write-release-scan-manifest.py \
            --version "$RELEASE_VERSION" \
            --source-sha "$GITHUB_SHA" \
            --controller-sha "$GITHUB_SHA" \
            --platform-contract-digest "$contract_digest" \
            --root "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/release-scan-manifest.json" \
            "${distributions[@]}"
      - name: Upload scan manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-scan-manifest
          path: release-scan-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Run consumer harness against manifest-verified artifacts
        run: |
          python3 scripts/run-consumer-harness.py \
            --manifest release-scan-manifest.json \
            --artifacts-root "$GITHUB_WORKSPACE"
      # Release-hardening program R5: resolve each required check to its exact
      # producing job/run rather than trusting a check-run name alone. This is
      # a blocking release gate; a missing or unverifiable proof fails closed.
      - name: Verify non-spoofable CI proof for this release commit
        run: |
          python3 scripts/write-ci-proof.py \
            --repo "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --manifest release-scan-manifest.json \
            --output ci-proof.json
        env:
          GH_TOKEN: ${{ github.token }}
      # A separate upload, not folded into "Upload scan manifest" above:
      # ci-proof.json is written by the step just before this one, after
      # that upload already ran.
      - name: Upload CI proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-ci-proof
          path: ci-proof.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish distributions with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          verbose: true

      - name: Verify published PyPI digests
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if python3 scripts/reconcile-pypi.py \
              --project rookie-cookies \
              --version "$RELEASE_VERSION" \
              --manifest release-scan-manifest.json \
              --artifacts-root "$GITHUB_WORKSPACE" \
              --require-complete; then
              exit 0
            fi
            test "$attempt" -eq 6 || sleep $((attempt * 5))
          done
          exit 1

  recovery:
    if: inputs.recovery_run_id != ''
    name: Recover rookie-cookies ${{ inputs.version }} from run ${{ inputs.recovery_run_id }}
    needs: preflight
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/rookie-cookies/${{ inputs.version }}/
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Verify the failed source run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::recovery_run_id must be a positive Actions run ID"
            exit 1
          fi
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN_ID")"
          if ! jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            --arg tag "v$RELEASE_VERSION" \
            '
              .repository.full_name == $repository
              and .path == ".github/workflows/publish-py.yml"
              and .event == "workflow_dispatch"
              and .head_sha == $sha
              and .head_branch == $tag
              and .status == "completed"
              and (
                .conclusion == "failure"
                or .conclusion == "cancelled"
                or .conclusion == "timed_out"
              )
            ' <<<"$run_json" >/dev/null; then
            echo "::error::run $RECOVERY_RUN_ID is not a completed failed publish-py.yml run for v$RELEASE_VERSION at $GITHUB_SHA"
            exit 1
          fi

      - name: Download original Linux wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: python-linux-*
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.recovery_run_id }}
          github-token: ${{ github.token }}
      - name: Download original Windows wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: python-windows-*
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.recovery_run_id }}
          github-token: ${{ github.token }}
      - name: Download original macOS wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: python-macos-*
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.recovery_run_id }}
          github-token: ${{ github.token }}
      - name: Download original source distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-sdist
          path: dist
          run-id: ${{ inputs.recovery_run_id }}
          github-token: ${{ github.token }}
      - name: Download original release manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-scan-manifest
          path: recovery
          run-id: ${{ inputs.recovery_run_id }}
          github-token: ${{ github.token }}

      - name: Verify original manifest and distributions
        run: |
          python3 scripts/run-consumer-harness.py \
            --manifest recovery/release-scan-manifest.json \
            --artifacts-root "$GITHUB_WORKSPACE"

      - name: Verify non-spoofable CI proof for the recovery bundle
        run: |
          python3 scripts/write-ci-proof.py \
            --repo "$GITHUB_REPOSITORY" \
            --commit-sha "$GITHUB_SHA" \
            --manifest recovery/release-scan-manifest.json \
            --output recovery/ci-proof.json
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Reconcile PyPI and stage only missing files
        id: reconcile
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reconcile-pypi.py \
            --project rookie-cookies \
            --version "$RELEASE_VERSION" \
            --manifest recovery/release-scan-manifest.json \
            --artifacts-root "$GITHUB_WORKSPACE" \
            --output-dir pypi-upload
          if find pypi-upload -maxdepth 1 -type f -print -quit | grep -q .; then
            echo "has_missing=true" >>"$GITHUB_OUTPUT"
          else
            echo "has_missing=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Upload recovery proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-recovery-proof-${{ inputs.recovery_run_id }}
          path: recovery/
          if-no-files-found: error
          retention-days: 30

      - name: Publish only missing distributions with trusted publishing
        if: steps.reconcile.outputs.has_missing == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: pypi-upload/
          verbose: true

      - name: Verify recovered PyPI digests
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if python3 scripts/reconcile-pypi.py \
              --project rookie-cookies \
              --version "$RELEASE_VERSION" \
              --manifest recovery/release-scan-manifest.json \
              --artifacts-root "$GITHUB_WORKSPACE" \
              --require-complete; then
              exit 0
            fi
            test "$attempt" -eq 6 || sleep $((attempt * 5))
          done
          exit 1
