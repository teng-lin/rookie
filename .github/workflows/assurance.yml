name: Test assurance

on:
  schedule:
    - cron: '13 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libdbus-1-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly-2025-11-23
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: .
      - name: Install pinned coverage tool
        run: cargo install cargo-llvm-cov --version 0.9.0 --locked
      - name: Measure branch coverage
        run: |
          cargo +nightly-2025-11-23 llvm-cov \
            --workspace --all-features --all-targets --branch \
            --json --output-path coverage.json
          python scripts/check-coverage.py --report coverage.json

  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - portable_decoders
          - mozilla_session
          - source_classifier
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libdbus-1-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly-2025-11-23
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Build sanitizer-backed fuzz target
        run: cargo +nightly-2025-11-23 fuzz build ${{ matrix.target }}
      - name: Run sanitizer-backed fuzz target
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '300' || '45' }}
          FUZZ_WALL_SECONDS: ${{ github.event_name == 'schedule' && '360' || '75' }}
        run: |
          timeout --signal=TERM --kill-after=15s "${FUZZ_WALL_SECONDS}s" \
            cargo +nightly-2025-11-23 fuzz run ${{ matrix.target }} -- \
              -max_total_time="$FUZZ_SECONDS" -timeout=10 \
              -max_len=4096 -rss_limit_mb=2048
