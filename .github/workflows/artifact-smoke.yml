name: Installed release artifact smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-x64:
    name: Ubuntu x64 packages
    uses: ./.github/workflows/_artifact-smoke.yml
    with:
      runner: ubuntu-22.04
      rust-target: x86_64-unknown-linux-gnu
      python-target: x86_64
      npm-platform: linux-x64-gnu

  linux-arm64:
    name: Ubuntu ARM64 packages
    uses: ./.github/workflows/_artifact-smoke.yml
    with:
      runner: ubuntu-24.04-arm
      rust-target: aarch64-unknown-linux-gnu
      python-target: aarch64
      npm-platform: linux-arm64-gnu

  windows-x64:
    name: Windows x64 packages
    uses: ./.github/workflows/_artifact-smoke.yml
    with:
      runner: windows-2025
      rust-target: x86_64-pc-windows-msvc
      python-target: x64
      npm-platform: win32-x64-msvc
      cli-features: --features appbound

  macos-arm64:
    name: macOS ARM64 packages
    uses: ./.github/workflows/_artifact-smoke.yml
    with:
      runner: macos-15
      rust-target: aarch64-apple-darwin
      python-target: aarch64
      npm-platform: darwin-arm64

  macos-intel:
    name: macOS Intel packages (scheduled compatibility)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_artifact-smoke.yml
    with:
      runner: macos-15-intel
      rust-target: x86_64-apple-darwin
      python-target: x86_64
      npm-platform: darwin-x64
