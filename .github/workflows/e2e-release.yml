name: E2E claimed browsers

# Opt-in on pull requests carrying the `e2e-release` label. Chrome/Firefox have
# a small automatic PR gate in e2e.yml. Nightly + dispatch install and drive
# the wider claimed-browser set; releases also run the fixture matrix.
on:
  schedule:
    - cron: '27 5 * * *'
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: e2e-claimed-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    name: claimed-browser matrix is complete
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e-release')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Check every registry cell has a lane
        run: python -m unittest discover -s tests/e2e -p 'test_browser_coverage.py' -v

  hosted-matrix:
    name: claimed-browser install matrix
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - id: matrix
        run: python tests/e2e/install_claimed_browser.py --print-matrix

  hosted-claimed:
    name: e2e install × ${{ matrix.os }} × ${{ matrix.browser }}
    needs:
      - coverage
      - hosted-matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.hosted-matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Put the browser profile outside the Git worktree
        shell: bash
        run: |
          echo "ROOKIE_E2E_USER_DATA_DIR=${RUNNER_TEMP}/rookie-ci/${{ matrix.browser }}" >> "$GITHUB_ENV"
          echo "ROOKIE_E2E_RUNNER_ENVIRONMENT=${{ runner.environment }}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Install Linux desktop / keyring packages
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            xvfb dbus dbus-x11 gnome-keyring libsecret-tools at-spi2-core curl gnupg
      - name: Install Playwright package (Chromium/Edge distribution fallback)
        if: matrix.engine == 'chromium'
        working-directory: tests/e2e
        run: npm install --no-save playwright@1.62.1
      - name: Install the claimed browser
        run: python tests/e2e/install_claimed_browser.py --browser ${{ matrix.browser }} --platform ${{ matrix.platform }}
      - name: Pre-build CLI, Python, and Node
        shell: bash
        run: |
          case "${{ matrix.engine }}" in
            chromium) cargo test --test e2e_chrome --no-run --locked ;;
            gecko) cargo test --test e2e_firefox --no-run --locked ;;
            safari|internet_explorer) cargo test --test e2e_native --no-run --locked ;;
            *) echo "unknown browser engine: ${{ matrix.engine }}" >&2; exit 2 ;;
          esac
          cargo build -p rookie-cookies-cli --release --locked
          python3 -m venv .venv || python -m venv .venv
          if [ -x .venv/bin/python ]; then py=.venv/bin/python; else py=.venv/Scripts/python; fi
          "$py" -m pip install --upgrade --quiet pip maturin==1.14.1
          "$py" -m maturin develop --release --locked --manifest-path bindings/python/Cargo.toml
          (cd bindings/node && npm ci --omit=optional && npm run build -- -- --locked)
      - name: Seed installed browser and extract
        shell: bash
        run: |
          if [ -x .venv/bin/python ]; then py=.venv/bin/python; else py=.venv/Scripts/python; fi
          if [ "${{ matrix.platform }}" = macos ] && [ "${{ matrix.engine }}" = chromium ]; then
            "$py" tests/e2e/run_with_ephemeral_keychain.py \
              --service "$ROOKIE_E2E_KEYCHAIN_SERVICE" \
              --account "$ROOKIE_E2E_KEYCHAIN_ACCOUNT" -- \
              "$py" tests/e2e/run_hosted_claimed_e2e.py
          else
            "$py" tests/e2e/run_hosted_claimed_e2e.py
          fi

  fixtures:
    name: claimed-browser fixtures (${{ matrix.os }})
    needs: coverage
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux packages
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev dbus at-spi2-core
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build and install Python binding
        shell: bash
        run: |
          python -m venv .venv
          if [ -x .venv/bin/python ]; then
            py=.venv/bin/python
          else
            py=.venv/Scripts/python
          fi
          "$py" -m pip install --quiet maturin==1.14.1
          "$py" -m maturin develop --release --locked --manifest-path bindings/python/Cargo.toml
      - name: Extract fixtures for every claimed browser_id
        shell: bash
        run: |
          if [ -x .venv/bin/python ]; then
            py=.venv/bin/python
          else
            py=.venv/Scripts/python
          fi
          "$py" tests/e2e/run_claimed_browser_fixtures.py

  release-gate:
    name: "release gate: claimed browsers"
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs:
      - coverage
      - hosted-matrix
      - hosted-claimed
      - fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the complete claimed-browser matrix and fixtures
        env:
          COVERAGE: ${{ needs.coverage.result }}
          HOSTED_MATRIX: ${{ needs.hosted-matrix.result }}
          HOSTED_CLAIMED: ${{ needs.hosted-claimed.result }}
          FIXTURES: ${{ needs.fixtures.result }}
        run: |
          set -euo pipefail
          for result in "$COVERAGE" "$HOSTED_MATRIX" "$HOSTED_CLAIMED" "$FIXTURES"; do
            test "$result" = success
          done
