name: E2E real-browser

on:
  pull_request:
    paths:
      - '.github/workflows/e2e.yml'
      - 'rookie-rs/**'
      - 'cli/**'
      - 'bindings/**'
      - 'tests/e2e/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-chrome:
    name: e2e ubuntu × chrome (libsecret)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Chrome refuses CDP/remote-debugging when the user-data-dir is the
      # default profile location (~/.config/google-chrome), so the seed
      # step uses a dedicated dir. The test reads it back via env var.
      ROOKIE_E2E_USER_DATA_DIR: ${{ github.workspace }}/.rookie-ci/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Linux desktop / keyring packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            xvfb dbus dbus-x11 gnome-keyring libsecret-tools at-spi2-core

      - name: Install Playwright (API only — Chrome comes from the runner image)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save playwright

      - name: Pre-build the e2e test binary (avoid running cargo inside dbus session)
        run: cargo test --test e2e_chrome --no-run

      - name: Seed Chrome profile and run extraction
        run: |
          mkdir -p "$ROOKIE_E2E_USER_DATA_DIR"
          dbus-run-session -- bash -euxo pipefail <<'SH'
            # Unlock + start a session-scoped secret service so Chrome's
            # libsecret writes land somewhere `rookie` can read them back.
            eval "$(printf '\n' | gnome-keyring-daemon --unlock || true)"
            eval "$(gnome-keyring-daemon --start --components=secrets || true)"
            export XDG_CURRENT_DESKTOP=GNOME

            # Local cookie-issuing server.
            python3 tests/e2e/cookie_server.py &
            SERVER_PID=$!
            trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

            # Give the server a moment to bind.
            for _ in 1 2 3 4 5; do
              curl -fs http://127.0.0.1:8765/ >/dev/null && break
              sleep 0.3
            done

            # Launch Chrome under Xvfb so the persistent profile is created on
            # disk with libsecret-encrypted cookies. Using a NON-default
            # user-data-dir — Chrome refuses CDP on its default location.
            xvfb-run -a node tests/e2e/seed_chromium_cookie.mjs \
              chrome "$ROOKIE_E2E_USER_DATA_DIR" "http://127.0.0.1:8765/set"

            # Sanity-check the artifacts.
            ls -la "$ROOKIE_E2E_USER_DATA_DIR/Default/" || true
            test -f "$ROOKIE_E2E_USER_DATA_DIR/Default/Network/Cookies" \
              || test -f "$ROOKIE_E2E_USER_DATA_DIR/Default/Cookies"

            # Run the extraction test against the seeded profile.
            cargo test --test e2e_chrome -- --ignored --nocapture
          SH

  ubuntu-firefox:
    name: e2e ubuntu × firefox
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Firefox stores cookies unencrypted in cookies.sqlite, so no keyring
      # dance is needed. We still use a workspace-scoped profile dir so the
      # path is unambiguous and inspectable after the run.
      ROOKIE_E2E_FIREFOX_PROFILE: ${{ github.workspace }}/.rookie-ci/firefox
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb

      - name: Install Playwright + bundled Firefox
        # Playwright bundles a patched Firefox for DevTools/CDP; system Firefox
        # cannot drive Playwright. We only download Firefox, not all browsers.
        run: |
          npm install --no-save playwright
          npx playwright install firefox

      - name: Pre-build the e2e test binary
        run: cargo test --test e2e_firefox --no-run

      - name: Seed Firefox profile and run extraction
        run: |
          set -euxo pipefail
          mkdir -p "$ROOKIE_E2E_FIREFOX_PROFILE"

          python3 tests/e2e/cookie_server.py &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for _ in 1 2 3 4 5; do
            curl -fs http://127.0.0.1:8765/ >/dev/null && break
            sleep 0.3
          done

          xvfb-run -a node tests/e2e/seed_firefox_cookie.mjs \
            "$ROOKIE_E2E_FIREFOX_PROFILE" "http://127.0.0.1:8765/set"

          ls -la "$ROOKIE_E2E_FIREFOX_PROFILE/" || true
          test -f "$ROOKIE_E2E_FIREFOX_PROFILE/cookies.sqlite"

          cargo test --test e2e_firefox -- --ignored --nocapture

  macos-firefox:
    name: e2e macos × firefox
    runs-on: macos-15
    timeout-minutes: 20
    env:
      ROOKIE_E2E_FIREFOX_PROFILE: ${{ github.workspace }}/.rookie-ci/firefox
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright + bundled Firefox
        run: |
          npm install --no-save playwright
          npx playwright install firefox

      - name: Pre-build the e2e test binary
        run: cargo test --test e2e_firefox --no-run

      - name: Seed Firefox profile and run extraction
        run: |
          set -euxo pipefail
          mkdir -p "$ROOKIE_E2E_FIREFOX_PROFILE"

          python3 tests/e2e/cookie_server.py &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for _ in 1 2 3 4 5; do
            curl -fs http://127.0.0.1:8765/ >/dev/null && break
            sleep 0.3
          done

          # macOS runners have a real WindowServer; no Xvfb needed.
          node tests/e2e/seed_firefox_cookie.mjs \
            "$ROOKIE_E2E_FIREFOX_PROFILE" "http://127.0.0.1:8765/set"

          ls -la "$ROOKIE_E2E_FIREFOX_PROFILE/" || true
          test -f "$ROOKIE_E2E_FIREFOX_PROFILE/cookies.sqlite"

          cargo test --test e2e_firefox -- --ignored --nocapture

  macos-chrome:
    name: e2e macos × chrome (keychain)
    runs-on: macos-15
    timeout-minutes: 25
    # Keychain interaction under Playwright on CI is unresolved: with
    # --use-mock-keychain the cookie is sealed under a key rookie can't
    # reproduce, and without it Chrome blocks on TCC prompts for the
    # Keychain entry until Playwright times out. Tracked separately; do
    # not block merges on this job until the workaround lands.
    continue-on-error: true
    env:
      ROOKIE_E2E_USER_DATA_DIR: ${{ github.workspace }}/.rookie-ci/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright (system Chrome via channel)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save playwright

      - name: Pre-seed `Chrome Safe Storage` in the login keychain
        # MUST happen before Chrome's first launch — otherwise Chrome
        # generates its own random AES key and seals the cookie under a
        # value the test fixture cannot reproduce.
        run: |
          security delete-generic-password \
            -a Chrome -s "Chrome Safe Storage" \
            login.keychain-db 2>/dev/null || true
          security add-generic-password \
            -a Chrome -s "Chrome Safe Storage" \
            -w "rookie-ci-chrome-safe-storage" \
            -A \
            login.keychain-db

      - name: Pre-build the e2e test binary
        run: cargo test --test e2e_chrome --no-run

      - name: Seed Chrome profile and run extraction
        run: |
          set -euxo pipefail
          mkdir -p "$ROOKIE_E2E_USER_DATA_DIR"

          python3 tests/e2e/cookie_server.py &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for _ in 1 2 3 4 5; do
            curl -fs http://127.0.0.1:8765/ >/dev/null && break
            sleep 0.3
          done

          # macos-15 has a real WindowServer; no Xvfb wrapper.
          node tests/e2e/seed_chromium_cookie.mjs \
            chrome "$ROOKIE_E2E_USER_DATA_DIR" "http://127.0.0.1:8765/set"

          ls -la "$ROOKIE_E2E_USER_DATA_DIR/Default/" || true
          test -f "$ROOKIE_E2E_USER_DATA_DIR/Default/Network/Cookies" \
            || test -f "$ROOKIE_E2E_USER_DATA_DIR/Default/Cookies"

          cargo test --test e2e_chrome -- --ignored --nocapture

  windows-chrome:
    name: e2e windows × chrome (DPAPI + AppBound)
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      ROOKIE_E2E_USER_DATA_DIR: ${{ github.workspace }}\.rookie-ci\google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright (system Chrome via channel)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save playwright

      - name: Confirm runner is Administrator (required for AppBound v20+)
        # GitHub's windows-* runners run as Administrator with UAC disabled,
        # which satisfies rookie's privilege::user::privileged() check in the
        # AppBound code path. We assert it explicitly so this test fails fast
        # rather than silently falling back to the legacy DPAPI-only path.
        run: |
          $principal = New-Object Security.Principal.WindowsPrincipal(
            [Security.Principal.WindowsIdentity]::GetCurrent()
          )
          if (-not $principal.IsInRole(
            [Security.Principal.WindowsBuiltInRole]::Administrator
          )) {
            throw "windows runner is not Administrator — AppBound test cannot run"
          }

      - name: Pre-build the e2e test binary
        run: cargo test --test e2e_chrome --no-run

      - name: Seed Chrome profile and run extraction
        run: |
          New-Item -ItemType Directory -Force -Path "$env:ROOKIE_E2E_USER_DATA_DIR" | Out-Null

          $server = Start-Process python -ArgumentList "tests/e2e/cookie_server.py" -PassThru
          try {
            for ($i = 1; $i -le 5; $i++) {
              try { Invoke-WebRequest -Uri http://127.0.0.1:8765/ -UseBasicParsing | Out-Null; break } catch { Start-Sleep -Milliseconds 300 }
            }

            node tests/e2e/seed_chromium_cookie.mjs chrome "$env:ROOKIE_E2E_USER_DATA_DIR" "http://127.0.0.1:8765/set"

            $defaultDir = Join-Path $env:ROOKIE_E2E_USER_DATA_DIR "Default"
            $localState = Join-Path $env:ROOKIE_E2E_USER_DATA_DIR "Local State"
            if (-not (Test-Path $localState)) { throw "missing Local State at $localState" }
            $ls = Get-Content $localState -Raw | ConvertFrom-Json
            if (-not $ls.os_crypt.encrypted_key) { throw "Local State has no DPAPI encrypted_key" }
            # AppBound key landed = exercising the v20+ path. Recent Chrome
            # always writes it on first run; surface a clear failure if not.
            if (-not $ls.os_crypt.app_bound_encrypted_key) {
              throw "Local State has no app_bound_encrypted_key — this run did not exercise the AppBound path"
            }
            Get-ChildItem $defaultDir | Format-Table

            cargo test --test e2e_chrome -- --ignored --nocapture
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
