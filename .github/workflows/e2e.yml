name: E2E real-browser

on:
  push:
    branches:
      - main
  schedule:
    # Nightly drift canary for runner images and system-installed browsers.
    - cron: '27 5 * * *'
  workflow_dispatch:
    inputs:
      appbound_only:
        description: Run only the elevated Windows App-Bound canary
        type: boolean
        default: false
      multi_browser:
        description: Run the hosted App-Bound canary on Chrome, Edge, and Brave
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ubuntu-chrome:
    name: e2e ubuntu × chrome (libsecret)
    if: github.event_name != 'workflow_dispatch' || !inputs.appbound_only
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Chrome refuses CDP/remote-debugging when the user-data-dir is the
      # default profile location (~/.config/google-chrome), so the seed
      # step uses a dedicated dir. The test reads it back via env var.
      ROOKIE_E2E_USER_DATA_DIR: ${{ github.workspace }}/.rookie-ci/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install Linux desktop / keyring packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            xvfb dbus dbus-x11 gnome-keyring libsecret-tools at-spi2-core

      - name: Install Playwright (API only — Chrome comes from the runner image)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        working-directory: tests/e2e
        run: npm install --no-save playwright@1.62.1

      - name: Pre-build the e2e test binary (avoid running cargo inside dbus session)
        run: cargo test --test e2e_chrome --no-run --locked

      - name: Build and install rookie-cookies into a venv
        # `maturin develop` needs an active venv. We pre-build the abi3 wheel
        # outside the dbus session so cargo's network/cache layer doesn't
        # have to negotiate with the keyring scope.
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade --quiet pip maturin==1.14.1
          cd bindings/python && ../../.venv/bin/maturin develop --release --locked

      - name: Pre-build the rookie-cookies CLI
        run: cargo build -p rookie-cookies-cli --release --locked

      - name: Build the Node binding
        # napi-rs writes a platform-specific .node next to index.js.
        # Omit optionalDependencies: those are the already-published
        # rookie-cookies-<platform>@0.6.0-alpha.3 addons, which do not
        # export read/ReadResult. Installing them lets index.js load a
        # stale prebuild instead of the addon this step just compiled.
        working-directory: bindings/node
        run: |
          npm ci --omit=optional
          npm run build -- --cargo-flags=--locked
          node -e "const m=require('./index.js'); if (typeof m.read!=='function'||typeof m.ReadResult!=='function') { throw new Error('local Node binding missing job API: read='+typeof m.read+' ReadResult='+typeof m.ReadResult) }"

      - name: Seed Chrome profile and run extraction (rust + python + cli + node)
        run: |
          mkdir -p "$ROOKIE_E2E_USER_DATA_DIR"
          dbus-run-session -- bash -euxo pipefail <<'SH'
            # Unlock + start a session-scoped secret service so Chrome's
            # libsecret writes land somewhere `rookie-cookies` can read them back.
            eval "$(printf '\n' | gnome-keyring-daemon --unlock || true)"
            eval "$(gnome-keyring-daemon --start --components=secrets || true)"
            export XDG_CURRENT_DESKTOP=GNOME

            # Local cookie-issuing server.
            python3 tests/e2e/cookie_server.py &
            SERVER_PID=$!
            trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

            SERVER_READY=0
            for _ in $(seq 1 30); do
              if curl -fs http://127.0.0.1:8765/ >/dev/null; then
                SERVER_READY=1
                break
              fi
              sleep 0.5
            done
            test "$SERVER_READY" = 1

            # Launch Chrome under Xvfb so the persistent profile is created on
            # disk with libsecret-encrypted cookies. Using a NON-default
            # user-data-dir — Chrome refuses CDP on its default location.
            xvfb-run -a node tests/e2e/seed_chromium_cookie.mjs \
              chrome "$ROOKIE_E2E_USER_DATA_DIR" "http://127.0.0.1:8765/set"

            # Sanity-check the artifacts.
            ls -la "$ROOKIE_E2E_USER_DATA_DIR/Default/" || true
            test -f "$ROOKIE_E2E_USER_DATA_DIR/Default/Network/Cookies" \
              || test -f "$ROOKIE_E2E_USER_DATA_DIR/Default/Cookies"

            # Four bindings, one seeded profile — assert that rust, python,
            # node, and the CLI binary all agree on rookie_ci=bar.
            cargo test --test e2e_chrome --locked -- --ignored --nocapture
            .venv/bin/python tests/e2e/assert_chrome_cookie.py
            node tests/e2e/assert_chrome_cookie.mjs

            COOKIES_DB="$ROOKIE_E2E_USER_DATA_DIR/Default/Network/Cookies"
            [ -f "$COOKIES_DB" ] || COOKIES_DB="$ROOKIE_E2E_USER_DATA_DIR/Default/Cookies"
            .venv/bin/python tests/e2e/assert_cli_cookie.py "$COOKIES_DB"
          SH

  ubuntu-firefox:
    name: e2e ubuntu × firefox
    if: github.event_name != 'workflow_dispatch' || !inputs.appbound_only
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Firefox stores cookies unencrypted in cookies.sqlite, so no keyring
      # dance is needed. We still use a workspace-scoped profile dir so the
      # path is unambiguous and inspectable after the run.
      ROOKIE_E2E_FIREFOX_PROFILE: ${{ github.workspace }}/.rookie-ci/firefox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb

      - name: Install Playwright + bundled Firefox
        # Playwright bundles a patched Firefox for DevTools/CDP; system Firefox
        # cannot drive Playwright. We only download Firefox, not all browsers.
        # Install under tests/e2e so seed_*.mjs can resolve `playwright` and
        # so we do not create a repo-root package.json that shadows bindings/node.
        working-directory: tests/e2e
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install firefox

      - name: Pre-build the e2e test binary
        run: |
          cargo test --test e2e_firefox --no-run --locked
          cargo build -p rookie-cookies --example report_surface --release --locked

      - name: Build and install rookie-cookies into a venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade --quiet pip maturin==1.14.1
          cd bindings/python && ../../.venv/bin/maturin develop --release --locked

      - name: Pre-build the rookie-cookies CLI
        run: cargo build -p rookie-cookies-cli --release --locked

      - name: Build the Node binding
        run: |
          cd bindings/node
          npm ci --omit=optional
          npm run build -- --cargo-flags=--locked
          node -e "const m=require('./index.js'); if (typeof m.read!=='function'||typeof m.ReadResult!=='function') { throw new Error('local Node binding missing job API: read='+typeof m.read+' ReadResult='+typeof m.ReadResult) }"

      - name: Compare report semantics across all four public surfaces
        run: |
          .venv/bin/python tests/e2e/check_report_surfaces.py \
            --rust target/release/examples/report_surface \
            --python .venv/bin/python \
            --node "$(command -v node)" \
            --cli target/release/rookie-cookies

      - name: Seed Firefox profile and run extraction (rust + python + cli + node)
        run: |
          set -euxo pipefail
          mkdir -p "$ROOKIE_E2E_FIREFOX_PROFILE"

          python3 tests/e2e/cookie_server.py &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          SERVER_READY=0
          for _ in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8765/ >/dev/null; then
              SERVER_READY=1
              break
            fi
            sleep 0.5
          done
          test "$SERVER_READY" = 1

          xvfb-run -a node tests/e2e/seed_firefox_cookie.mjs \
            "$ROOKIE_E2E_FIREFOX_PROFILE" "http://127.0.0.1:8765/set"

          ls -la "$ROOKIE_E2E_FIREFOX_PROFILE/" || true
          test -f "$ROOKIE_E2E_FIREFOX_PROFILE/cookies.sqlite"

          cargo test --test e2e_firefox --locked -- --ignored --nocapture
          .venv/bin/python tests/e2e/assert_firefox_cookie.py
          node tests/e2e/assert_firefox_cookie.mjs
          .venv/bin/python tests/e2e/assert_cli_cookie.py \
            "$ROOKIE_E2E_FIREFOX_PROFILE/cookies.sqlite"

      - name: Run docs/examples against the seeded profile
        # Doubles as a smoke gate for examples drifting away from the
        # public API. Each example expects a cookies.sqlite path as its
        # first argument and prints every cookie it finds; we grep for
        # the seeded `rookie_ci=bar` token to confirm the read path is
        # still wired up correctly.
        run: |
          set -euxo pipefail
          DB="$ROOKIE_E2E_FIREFOX_PROFILE/cookies.sqlite"

          # Rust
          cargo run --release --locked --example from_path -p rookie-cookies -- "$DB" \
            | tee /tmp/rookie-example-rust.out
          grep 'rookie_ci' /tmp/rookie-example-rust.out
          grep '"bar"' /tmp/rookie-example-rust.out

          # Python
          .venv/bin/python examples/python/from_path.py "$DB" \
            | tee /tmp/rookie-example-python.out
          grep 'rookie_ci' /tmp/rookie-example-python.out
          grep "'bar'" /tmp/rookie-example-python.out

          # Node
          cd examples/javascript
          npm install --silent
          node from_path.mjs "$DB" | tee /tmp/rookie-example-node.out
          grep 'rookie_ci' /tmp/rookie-example-node.out
          grep "'bar'" /tmp/rookie-example-node.out

  macos-firefox:
    name: e2e macos × firefox
    if: github.event_name != 'workflow_dispatch' || !inputs.appbound_only
    runs-on: macos-15
    timeout-minutes: 20
    env:
      ROOKIE_E2E_FIREFOX_PROFILE: ${{ github.workspace }}/.rookie-ci/firefox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install Playwright + bundled Firefox
        working-directory: tests/e2e
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install firefox

      - name: Pre-build the e2e test binary
        run: cargo test --test e2e_firefox --no-run --locked

      - name: Build and install rookie-cookies into a venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade --quiet pip maturin==1.14.1
          cd bindings/python && ../../.venv/bin/maturin develop --release --locked

      - name: Pre-build the rookie-cookies CLI
        run: cargo build -p rookie-cookies-cli --release --locked

      - name: Build the Node binding
        run: |
          cd bindings/node
          npm ci --omit=optional
          npm run build -- --cargo-flags=--locked
          node -e "const m=require('./index.js'); if (typeof m.read!=='function'||typeof m.ReadResult!=='function') { throw new Error('local Node binding missing job API: read='+typeof m.read+' ReadResult='+typeof m.ReadResult) }"

      - name: Seed Firefox profile and run extraction (rust + python + cli + node)
        run: |
          set -euxo pipefail
          mkdir -p "$ROOKIE_E2E_FIREFOX_PROFILE"

          python3 tests/e2e/cookie_server.py &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          SERVER_READY=0
          for _ in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8765/ >/dev/null; then
              SERVER_READY=1
              break
            fi
            sleep 0.5
          done
          test "$SERVER_READY" = 1

          # macOS runners have a real WindowServer; no Xvfb needed.
          node tests/e2e/seed_firefox_cookie.mjs \
            "$ROOKIE_E2E_FIREFOX_PROFILE" "http://127.0.0.1:8765/set"

          ls -la "$ROOKIE_E2E_FIREFOX_PROFILE/" || true
          test -f "$ROOKIE_E2E_FIREFOX_PROFILE/cookies.sqlite"

          cargo test --test e2e_firefox --locked -- --ignored --nocapture
          .venv/bin/python tests/e2e/assert_firefox_cookie.py
          node tests/e2e/assert_firefox_cookie.mjs
          .venv/bin/python tests/e2e/assert_cli_cookie.py \
            "$ROOKIE_E2E_FIREFOX_PROFILE/cookies.sqlite"

  macos-chrome:
    name: e2e macos × chrome (real Keychain lookup)
    if: github.event_name != 'workflow_dispatch' || !inputs.appbound_only
    runs-on: macos-15
    timeout-minutes: 25
    # Playwright keeps Chromium's --use-mock-keychain default on macOS, whose
    # encrypted cookies use `mock_password`. The job seeds that value into an
    # ephemeral real Keychain item, then rookie-cookies must retrieve it through
    # `/usr/bin/security`; no production fallback candidate exists.
    env:
      ROOKIE_E2E_USER_DATA_DIR: ${{ github.workspace }}/.rookie-ci/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install Playwright (system Chrome via channel)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        working-directory: tests/e2e
        run: npm install --no-save playwright@1.62.1

      - name: Pre-build the e2e test binary
        run: cargo test --test e2e_chrome --no-run --locked

      - name: Build and install rookie-cookies into a venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade --quiet pip maturin==1.14.1
          cd bindings/python && ../../.venv/bin/maturin develop --release --locked

      - name: Pre-build the rookie-cookies CLI
        run: cargo build -p rookie-cookies-cli --release --locked

      - name: Build the Node binding
        run: |
          cd bindings/node
          npm ci --omit=optional
          npm run build -- --cargo-flags=--locked
          node -e "const m=require('./index.js'); if (typeof m.read!=='function'||typeof m.ReadResult!=='function') { throw new Error('local Node binding missing job API: read='+typeof m.read+' ReadResult='+typeof m.ReadResult) }"

      - name: Seed Chrome profile and run extraction (rust + python + cli + node)
        run: |
          set -euxo pipefail
          mkdir -p "$ROOKIE_E2E_USER_DATA_DIR"

          /usr/bin/security delete-generic-password \
            -a Chrome -s "Chrome Safe Storage" >/dev/null 2>&1 || true
          /usr/bin/security add-generic-password -U \
            -a Chrome -s "Chrome Safe Storage" -w mock_password
          test "$(/usr/bin/security find-generic-password \
            -a Chrome -s "Chrome Safe Storage" -w)" = mock_password

          python3 tests/e2e/cookie_server.py &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            /usr/bin/security delete-generic-password \
              -a Chrome -s "Chrome Safe Storage" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          SERVER_READY=0
          for _ in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8765/ >/dev/null; then
              SERVER_READY=1
              break
            fi
            sleep 0.5
          done
          test "$SERVER_READY" = 1

          # macos-15 has a real WindowServer; no Xvfb wrapper.
          node tests/e2e/seed_chromium_cookie.mjs \
            chrome "$ROOKIE_E2E_USER_DATA_DIR" "http://127.0.0.1:8765/set"

          ls -la "$ROOKIE_E2E_USER_DATA_DIR/Default/" || true
          test -f "$ROOKIE_E2E_USER_DATA_DIR/Default/Network/Cookies" \
            || test -f "$ROOKIE_E2E_USER_DATA_DIR/Default/Cookies"

          cargo test --test e2e_chrome --locked -- --ignored --nocapture
          .venv/bin/python tests/e2e/assert_chrome_cookie.py
          node tests/e2e/assert_chrome_cookie.mjs

          COOKIES_DB="$ROOKIE_E2E_USER_DATA_DIR/Default/Network/Cookies"
          [ -f "$COOKIES_DB" ] \
            || COOKIES_DB="$ROOKIE_E2E_USER_DATA_DIR/Default/Cookies"
          .venv/bin/python tests/e2e/assert_cli_cookie.py "$COOKIES_DB"

  windows-firefox:
    name: e2e windows × firefox
    if: github.event_name != 'workflow_dispatch' || !inputs.appbound_only
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      ROOKIE_E2E_FIREFOX_PROFILE: ${{ github.workspace }}\.rookie-ci\firefox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install Playwright + bundled Firefox
        working-directory: tests/e2e
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm install --no-save playwright@1.62.1
          npx playwright install firefox
          npx playwright --version

      - name: Pre-build the e2e test binary
        run: cargo test --test e2e_firefox --no-run --locked

      - name: Build and install rookie-cookies into a venv
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .venv
          & .\.venv\Scripts\python.exe -m pip install --upgrade --quiet pip maturin==1.14.1
          Push-Location bindings/python
          & ..\..\.venv\Scripts\python.exe -m maturin develop --release --locked
          Pop-Location

      - name: Pre-build the rookie-cookies CLI
        run: cargo build -p rookie-cookies-cli --release --locked

      - name: Build the Node binding
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Push-Location bindings/node
          npm ci --omit=optional
          npm run build -- --cargo-flags=--locked
          node -e "const m=require('./index.js'); if (typeof m.read!=='function'||typeof m.ReadResult!=='function') { throw new Error('local Node binding missing job API: read='+typeof m.read+' ReadResult='+typeof m.ReadResult) }"
          Pop-Location

      - name: Seed Firefox profile and run extraction (rust + python + cli + node)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force -Path "$env:ROOKIE_E2E_FIREFOX_PROFILE" | Out-Null

          $server = Start-Process python -ArgumentList "tests/e2e/cookie_server.py" -PassThru
          try {
            $serverReady = $false
            for ($i = 1; $i -le 30; $i++) {
              try {
                Invoke-WebRequest -Uri http://127.0.0.1:8765/ -UseBasicParsing | Out-Null
                $serverReady = $true
                break
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $serverReady) { throw "cookie server did not become ready" }

            node tests/e2e/seed_firefox_cookie.mjs `
              "$env:ROOKIE_E2E_FIREFOX_PROFILE" "http://127.0.0.1:8765/set"

            $cookiesDb = Join-Path $env:ROOKIE_E2E_FIREFOX_PROFILE "cookies.sqlite"
            if (-not (Test-Path $cookiesDb)) {
              throw "missing Firefox Cookies database at $cookiesDb"
            }
            Get-ChildItem "$env:ROOKIE_E2E_FIREFOX_PROFILE" | Format-Table

            cargo test --test e2e_firefox --locked -- --ignored --nocapture
            & .\.venv\Scripts\python.exe tests/e2e/assert_firefox_cookie.py
            node tests/e2e/assert_firefox_cookie.mjs
            & .\.venv\Scripts\python.exe tests/e2e/assert_cli_cookie.py "$cookiesDb"
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

  windows-chrome-appbound:
    name: e2e windows × ${{ matrix.browser }} (App-Bound v20 canary)
    # Default-profile App-Bound extraction is elevated. Pull requests never run
    # it; scheduled/push runs use main, while maintainers may explicitly select
    # a trusted feature ref for pre-merge validation with workflow_dispatch.
    # Chrome and Edge ship on windows-2025. Brave is installed machine-wide
    # in this job. CocCoc and Avast stay out of the hosted matrix.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'release') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJson(
          (github.event_name == 'schedule' || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || inputs.multi_browser)
          && '["chrome", "edge", "brave"]'
          || '["chrome"]'
          ) }}
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install machine-wide Brave
        if: matrix.browser == 'brave'
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-BraveMachineExe {
            @(
              "$env:ProgramFiles\BraveSoftware\Brave-Browser\Application\brave.exe",
              "${env:ProgramFiles(x86)}\BraveSoftware\Brave-Browser\Application\brave.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          if (-not (Get-BraveMachineExe)) {
            $installed = $false
            try {
              Write-Host "Installing Brave via winget (machine scope)"
              & winget install -e --id Brave.Brave --scope machine `
                --accept-package-agreements --accept-source-agreements `
                --disable-interactivity --source winget
              $installed = [bool](Get-BraveMachineExe)
            } catch {
              Write-Host "winget install failed: $_"
            }

            if (-not $installed) {
              Write-Host "Installing Brave via Chocolatey"
              & choco install brave -y --no-progress
              $installed = [bool](Get-BraveMachineExe)
            }

            if (-not $installed) {
              Write-Host "Installing Brave via standalone system-level setup"
              $installer = Join-Path $env:RUNNER_TEMP "BraveBrowserStandaloneSetup.exe"
              Invoke-WebRequest -Uri "https://laptop-updates.brave.com/latest/winx64" `
                -OutFile $installer
              $setup = Start-Process -FilePath $installer `
                -ArgumentList "--install","--silent","--system-level" `
                -Wait -PassThru
              if ($setup.ExitCode -ne 0 -and $setup.ExitCode -ne 3010) {
                throw "Brave standalone installer exited $($setup.ExitCode)"
              }
            }
          }

          $deadline = [datetime]::UtcNow.AddMinutes(3)
          while (-not (Get-BraveMachineExe) -and [datetime]::UtcNow -lt $deadline) {
            Start-Sleep -Seconds 2
          }
          $exe = Get-BraveMachineExe
          if (-not $exe) {
            throw "Brave machine-wide install did not produce brave.exe under Program Files"
          }
          Write-Host "Brave installed: $exe"

          Get-Process brave -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          $userData = Join-Path $env:LOCALAPPDATA `
            "BraveSoftware\Brave-Browser\User Data"
          if (Test-Path $userData) {
            Write-Host "Removing installer-created Brave profile so the canary starts empty"
            Remove-Item $userData -Recurse -Force
          }

      - name: Enforce App-Bound host and identity preconditions
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($identity)
          $isAdmin = $principal.IsInRole(
            [Security.Principal.WindowsBuiltInRole]::Administrator
          )
          whoami /user
          Write-Host "Administrator: $isAdmin"
          if (-not $isAdmin) {
            throw "App-Bound canary requires the runner process to be elevated"
          }

          $targetBrowser = "${{ matrix.browser }}"
          Write-Host "Target Browser: $targetBrowser"

          if ($targetBrowser -eq "chrome") {
            $browserCandidates = @(
              "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
              "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
            )
            $userDataDir = Join-Path $env:LOCALAPPDATA "Google\Chrome\User Data"
            $procName = "chrome"
          } elseif ($targetBrowser -eq "edge") {
            $browserCandidates = @(
              "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
              "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
            )
            $userDataDir = Join-Path $env:LOCALAPPDATA "Microsoft\Edge\User Data"
            $procName = "msedge"
          } elseif ($targetBrowser -eq "brave") {
            $browserCandidates = @(
              "$env:ProgramFiles\BraveSoftware\Brave-Browser\Application\brave.exe",
              "${env:ProgramFiles(x86)}\BraveSoftware\Brave-Browser\Application\brave.exe",
              "$env:LOCALAPPDATA\BraveSoftware\Brave-Browser\Application\brave.exe"
            )
            $userDataDir = Join-Path $env:LOCALAPPDATA "BraveSoftware\Brave-Browser\User Data"
            $procName = "brave"
          } elseif ($targetBrowser -eq "coccoc") {
            $browserCandidates = @(
              "$env:ProgramFiles\CocCoc\Browser\Application\browser.exe",
              "${env:ProgramFiles(x86)}\CocCoc\Browser\Application\browser.exe",
              "$env:LOCALAPPDATA\CocCoc\Browser\Application\browser.exe"
            )
            $userDataDir = Join-Path $env:LOCALAPPDATA "CocCoc\Browser\User Data"
            $procName = "browser"
          } elseif ($targetBrowser -eq "avast") {
            $browserCandidates = @(
              "$env:ProgramFiles\AVAST Software\Browser\Application\AvastBrowser.exe",
              "${env:ProgramFiles(x86)}\AVAST Software\Browser\Application\AvastBrowser.exe"
            )
            $userDataDir = Join-Path $env:LOCALAPPDATA "AVAST Software\Browser\User Data"
            $procName = "AvastBrowser"
          } else {
            throw "unsupported App-Bound canary browser '$targetBrowser'"
          }

          $browserPath = $browserCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browserPath) {
            throw "machine-wide $targetBrowser was not found below Program Files"
          }
          $browserPath = (Resolve-Path $browserPath).Path
          $browserVersion = (Get-Item $browserPath).VersionInfo.FileVersion
          Write-Host "System $($targetBrowser): $browserPath ($browserVersion)"

          if (Get-Process $procName -ErrorAction SilentlyContinue) {
            throw "$targetBrowser was already running; refusing to reuse an unknown profile session"
          }
          $existingCookieDbs = @(
            (Join-Path $userDataDir "Default\Network\Cookies"),
            (Join-Path $userDataDir "Default\Cookies")
          ) | Where-Object { Test-Path $_ }
          if ($existingCookieDbs.Count -gt 0) {
            throw "default profile already contains a Cookies database; refusing to inspect it"
          }

          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, BuildNumber | Format-List
          Write-Host "Default $targetBrowser user-data dir: $userDataDir"
          $requestLog = Join-Path $env:RUNNER_TEMP "rookie-e2e-browser-requests.log"
          "ROOKIE_E2E_TARGET_BROWSER=$targetBrowser" | Out-File $env:GITHUB_ENV -Append
          "ROOKIE_E2E_BROWSER_PATH=$browserPath" | Out-File $env:GITHUB_ENV -Append
          "ROOKIE_E2E_CHROME_PATH=$browserPath" | Out-File $env:GITHUB_ENV -Append
          "ROOKIE_E2E_USER_DATA_DIR=$userDataDir" | Out-File $env:GITHUB_ENV -Append
          "ROOKIE_E2E_WINDOWS_SID=$($identity.User.Value)" | Out-File $env:GITHUB_ENV -Append
          "ROOKIE_E2E_REQUEST_LOG=$requestLog" | Out-File $env:GITHUB_ENV -Append

      - name: Pre-build the App-Bound e2e test binary
        run: cargo test --test e2e_chrome --no-run --locked

      - name: Build and install rookie-cookies into a venv
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .venv
          & .\.venv\Scripts\python.exe -m pip install --quiet maturin==1.14.1
          Push-Location bindings/python
          & ..\..\.venv\Scripts\python.exe -m maturin develop --release --locked
          Pop-Location

      - name: Pre-build the App-Bound rookie-cookies CLI
        run: cargo build -p rookie-cookies-cli --release --locked

      - name: Build the App-Bound Node binding
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Push-Location bindings/node
          npm ci --omit=optional
          npm run build -- --cargo-flags=--locked
          node -e "const m=require('./index.js'); if (typeof m.read!=='function'||typeof m.ReadResult!=='function') { throw new Error('local Node binding missing job API: read='+typeof m.read+' ReadResult='+typeof m.ReadResult) }"
          Pop-Location

      - name: Verify v20 and extract a live WAL cookie on all four surfaces
        run: tests/e2e/run_windows_appbound_canary.ps1

  windows-chrome:
    name: e2e windows × chrome (legacy DPAPI)
    if: github.event_name != 'workflow_dispatch' || !inputs.appbound_only
    runs-on: windows-2025
    timeout-minutes: 25
    # Hosted CI uses a workspace-scoped user-data-dir, so Chromium's AppBound
    # path is not expected. This job exercises legacy DPAPI v10 cookies and
    # logs non-secret key-shape diagnostics when extraction fails.
    defaults:
      run:
        shell: pwsh
    env:
      ROOKIE_E2E_USER_DATA_DIR: ${{ github.workspace }}\.rookie-ci\google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install Playwright (system Chrome via channel)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        working-directory: tests/e2e
        run: npm install --no-save playwright@1.62.1

      - name: Record Windows identity/admin status
        run: |
          whoami /user
          $principal = New-Object Security.Principal.WindowsPrincipal(
            [Security.Principal.WindowsIdentity]::GetCurrent()
          )
          $isAdmin = $principal.IsInRole(
            [Security.Principal.WindowsBuiltInRole]::Administrator
          )
          Write-Host "Administrator: $isAdmin"

      - name: Pre-build the e2e test binary
        run: cargo test --test e2e_chrome --no-run --locked

      - name: Build and install rookie-cookies into a venv
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .venv
          & .\.venv\Scripts\python.exe -m pip install --upgrade --quiet pip maturin==1.14.1
          Push-Location bindings/python
          & ..\..\.venv\Scripts\python.exe -m maturin develop --release --locked
          Pop-Location

      - name: Pre-build the rookie-cookies CLI
        run: cargo build -p rookie-cookies-cli --release --locked

      - name: Build the Node binding
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Push-Location bindings/node
          npm ci --omit=optional
          npm run build -- --cargo-flags=--locked
          node -e "const m=require('./index.js'); if (typeof m.read!=='function'||typeof m.ReadResult!=='function') { throw new Error('local Node binding missing job API: read='+typeof m.read+' ReadResult='+typeof m.ReadResult) }"
          Pop-Location

      - name: Exercise deterministic current-user DPAPI on all four surfaces
        env:
          ROOKIE_E2E_USER_DATA_DIR: ${{ runner.temp }}\rookie DPAPI fixture 雪
          ROOKIE_E2E_DOMAIN: example.test
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          & .\.venv\Scripts\python.exe tests/e2e/create_windows_dpapi_fixture.py `
            "$env:ROOKIE_E2E_USER_DATA_DIR"
          & .\.venv\Scripts\python.exe tests/e2e/inspect_chromium_profile.py `
            "$env:ROOKIE_E2E_USER_DATA_DIR" --cookie-name rookie_ci `
            --expected-prefix v10 --require-dpapi-key
          cargo test --test e2e_chrome --locked `
            extracts_seeded_cookie_from_chrome_dpapi_profile -- --ignored --nocapture
          & .\.venv\Scripts\python.exe tests/e2e/assert_chrome_cookie.py
          node tests/e2e/assert_chrome_cookie.mjs
          $cookiesDb = Join-Path $env:ROOKIE_E2E_USER_DATA_DIR "Default\Network\Cookies"
          $localState = Join-Path $env:ROOKIE_E2E_USER_DATA_DIR "Local State"
          & .\.venv\Scripts\python.exe tests/e2e/assert_cli_cookie.py `
            "$cookiesDb" --key-path "$localState"

      - name: Exercise row-level DPAPI across schema 23 and 24
        env:
          ROOKIE_E2E_DOMAIN: example.test
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $fixtures = @(
            [PSCustomObject]@{
              Kind = 'legacy-schema23'
              Schema = 23
              Name = 'rookie_ci_dpapi_23'
              Value = 'row DPAPI schema 23'
            },
            [PSCustomObject]@{
              Kind = 'legacy-schema24'
              Schema = 24
              Name = 'rookie_ci_dpapi_24'
              Value = 'row DPAPI schema 24'
            }
          )

          foreach ($fixture in $fixtures) {
            $root = Join-Path $env:RUNNER_TEMP "rookie $($fixture.Kind) fixture 雪"
            & .\.venv\Scripts\python.exe tests/e2e/create_windows_dpapi_fixture.py `
              "$root" --fixture $fixture.Kind --cookie-name $fixture.Name `
              --cookie-value $fixture.Value
            & .\.venv\Scripts\python.exe tests/e2e/inspect_chromium_profile.py `
              "$root" --cookie-name $fixture.Name --expected-prefix legacy-dpapi `
              --expected-schema-version $fixture.Schema --require-dpapi-key

            $env:ROOKIE_E2E_USER_DATA_DIR = $root
            $env:ROOKIE_E2E_COOKIE_NAME = $fixture.Name
            $env:ROOKIE_E2E_COOKIE_VALUE = $fixture.Value
            cargo test --test e2e_chrome --locked `
              extracts_seeded_cookie_from_chrome_dpapi_profile -- --ignored --nocapture
            & .\.venv\Scripts\python.exe tests/e2e/assert_chrome_cookie.py
            node tests/e2e/assert_chrome_cookie.mjs
            $cookiesDb = Join-Path $root "Default\Network\Cookies"
            $localState = Join-Path $root "Local State"
            & .\.venv\Scripts\python.exe tests/e2e/assert_cli_cookie.py `
              "$cookiesDb" --key-path "$localState"
          }

      - name: Seed Chrome profile and run extraction (rust + python + cli + node)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force -Path "$env:ROOKIE_E2E_USER_DATA_DIR" | Out-Null

          $chromeCandidates = @(
            (Join-Path $env:ProgramFiles "Google\Chrome\Application\chrome.exe"),
            (Join-Path ${env:ProgramFiles(x86)} "Google\Chrome\Application\chrome.exe")
          )
          $chromePath = $chromeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chromePath) { throw "system Chrome executable was not found" }
          $chromeVersion = (Get-Item $chromePath).VersionInfo.FileVersion
          Write-Host "System Chrome: $chromePath ($chromeVersion)"

          $server = Start-Process python -ArgumentList "tests/e2e/cookie_server.py" -PassThru
          try {
            $serverReady = $false
            for ($i = 1; $i -le 30; $i++) {
              try {
                Invoke-WebRequest -Uri http://127.0.0.1:8765/ -UseBasicParsing | Out-Null
                $serverReady = $true
                break
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $serverReady) { throw "cookie server did not become ready" }

            Write-Host "Identity before Chrome seed:"
            whoami /user
            node tests/e2e/seed_chromium_cookie.mjs chrome "$env:ROOKIE_E2E_USER_DATA_DIR" "http://127.0.0.1:8765/set"

            $defaultDir = Join-Path $env:ROOKIE_E2E_USER_DATA_DIR "Default"
            $cookiesDb = Join-Path $defaultDir "Network\Cookies"
            if (-not (Test-Path $cookiesDb)) { $cookiesDb = Join-Path $defaultDir "Cookies" }
            if (-not (Test-Path $cookiesDb)) { throw "missing Cookies database at $cookiesDb" }

            $localState = Join-Path $env:ROOKIE_E2E_USER_DATA_DIR "Local State"
            if (-not (Test-Path $localState)) { throw "missing Local State at $localState" }
            $ls = Get-Content $localState -Raw | ConvertFrom-Json
            if (-not $ls.os_crypt.encrypted_key) { throw "Local State has no DPAPI encrypted_key" }
            Add-Type -AssemblyName System.Security.Cryptography.ProtectedData
            $encryptedKeyBytes = [Convert]::FromBase64String([string]$ls.os_crypt.encrypted_key)
            if ($encryptedKeyBytes.Length -le 5) {
              throw "Local State encrypted_key length is $($encryptedKeyBytes.Length), expected DPAPI prefix plus payload"
            }
            [byte[]]$prefixBytes = $encryptedKeyBytes[0..4]
            $prefix = [Text.Encoding]::ASCII.GetString($prefixBytes)
            if ($prefix -ne "DPAPI") { throw "Local State encrypted_key prefix is '$prefix', expected DPAPI" }
            [byte[]]$wrapped = $encryptedKeyBytes[5..($encryptedKeyBytes.Length - 1)]
            $unwrapped = [Security.Cryptography.ProtectedData]::Unprotect(
              $wrapped,
              $null,
              [Security.Cryptography.DataProtectionScope]::CurrentUser
            )
            Write-Host "DPAPI encrypted_key diagnostics: wrapped_length=$($wrapped.Length) unwrapped_length=$($unwrapped.Length)"
            if ($unwrapped.Length -ne 32) { throw "DPAPI unwrapped key length was $($unwrapped.Length), expected 32" }
            Write-Host "app_bound_encrypted_key present in custom profile: $([bool]$ls.os_crypt.app_bound_encrypted_key)"
            & .\.venv\Scripts\python.exe tests/e2e/inspect_chromium_profile.py `
              "$env:ROOKIE_E2E_USER_DATA_DIR" --cookie-name rookie_ci `
              --expected-prefix v10 --require-dpapi-key
            Get-ChildItem $defaultDir | Format-Table

            Write-Host "Identity before rookie-cookies extraction:"
            whoami /user
            cargo test --test e2e_chrome --locked -- --ignored --nocapture
            & .\.venv\Scripts\python.exe tests/e2e/assert_chrome_cookie.py
            node tests/e2e/assert_chrome_cookie.mjs
            & .\.venv\Scripts\python.exe tests/e2e/assert_cli_cookie.py `
              "$cookiesDb" --key-path "$localState"
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
