name: Revalidate open PRs

# Pull-request checks are computed against the base as it stood when the branch
# was last pushed, and GitHub does not recompute them when `main` moves. A PR
# can therefore sit on hours-old green checks that were never evaluated against
# the code it is about to merge into, which is how three separate breakages
# reached `main` in one day: each merged on checks that predated a rename in
# another PR.
#
# This job recomputes the merge every time `main` advances and reports the
# result back onto each open PR, so "silently stale" becomes "visibly red"
# within minutes instead of at the next merge.
#
# It reports; it does not block. Making it a required check is a branch
# protection decision, deliberately kept separate from landing the signal.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  # Only the newest `main` matters. Supersede in-flight runs rather than
  # reporting a verdict against a base that has already moved again.
  group: revalidate-open-prs
  cancel-in-progress: true

jobs:
  list-open-prs:
    name: list open PRs
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.list.outputs.prs }}
    steps:
      - name: Collect open PRs targeting main
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prs=$(gh pr list --base main --state open --limit 50 \
                  --json number,headRefOid \
                  --jq '[.[] | {number: .number, sha: .headRefOid}]')
          echo "prs=$prs" >> "$GITHUB_OUTPUT"
          echo "Revalidating: $prs"

  revalidate:
    name: PR #${{ matrix.pr.number }} vs main (${{ matrix.os }})
    needs: list-open-prs
    if: needs.list-open-prs.outputs.prs != '[]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three, deliberately. The second of today's breakages lived in a
        # `#[cfg(target_os = "macos")]` block, so it compiled out entirely on
        # Linux and Windows; a single-platform check would have missed it.
        os: [ubuntu-latest, macos-latest, windows-latest]
        pr: ${{ fromJson(needs.list-open-prs.outputs.prs) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Merge the PR into current main
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin "pull/${{ matrix.pr.number }}/head"
          if git merge --no-edit --no-ff FETCH_HEAD; then
            echo "state=merged" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "state=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux packages
        if: steps.merge.outputs.state == 'merged' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev dbus at-spi2-core

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: steps.merge.outputs.state == 'merged'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.merge.outputs.state == 'merged'

      # Build the tests without running them. This catches the failure mode
      # that actually bit us — a rename or signature change on `main` that no
      # longer matches the PR — for a fraction of the cost of the full suite,
      # which the PR's own checks already run.
      - name: Build the merged tree
        if: steps.merge.outputs.state == 'merged'
        run: cargo test --workspace --all-targets --locked --no-run

      - name: Report the verdict on the PR head
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ steps.merge.outputs.state }}" = 'conflict' ]; then
            state=failure
            description='Conflicts with current main; rebase required'
          elif [ "${{ job.status }}" = 'success' ]; then
            state=success
            description='Merges and builds against current main'
          else
            state=failure
            description='Does not build when merged with current main'
          fi
          gh api "repos/${{ github.repository }}/statuses/${{ matrix.pr.sha }}" \
            -f state="$state" \
            -f context="revalidate vs main (${{ matrix.os }})" \
            -f description="$description" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
