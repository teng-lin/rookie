name: Revalidate open PRs

# Pull-request checks are computed against the base as it stood when the branch
# was last pushed, and GitHub does not recompute them when `main` moves. A PR
# can therefore sit on hours-old green checks that were never evaluated against
# the code it is about to merge into, which is how three separate breakages
# reached `main` in one day: each merged on checks that predated a rename in
# another PR.
#
# This job recomputes the merge every time `main` advances and reports the
# result back onto each open PR, so "silently stale" becomes "visibly red"
# within minutes instead of at the next merge.
#
# It reports; it does not block. Making it a required check is a branch
# protection decision, deliberately kept separate from landing the signal.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissions are granted per job so the job that executes a fork's code never
# receives the token that can write commit statuses.
permissions: {}

concurrency:
  # Only the newest `main` matters. Supersede in-flight runs rather than
  # reporting a verdict against a base that has already moved again.
  group: revalidate-open-prs
  cancel-in-progress: true

jobs:
  list-open-prs:
    name: list open PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prs: ${{ steps.list.outputs.prs }}
    steps:
      - name: Collect open PRs targeting main
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Only PRs that touch compiled code can be broken by a Rust change on
          # main, so a docs-only branch does not pay for three rebuilds.
          prs=$(gh pr list --base main --state open --limit 50 \
                  --json number,headRefOid,files \
                  --jq '[.[]
                         | select(any(.files[].path;
                             startswith("rookie-rs/")
                             or startswith("cli/")
                             or startswith("bindings/")
                             or . == "Cargo.toml"
                             or . == "Cargo.lock"))
                         | {number: .number, sha: .headRefOid}]')
          echo "prs=$prs" >> "$GITHUB_OUTPUT"
          echo "Revalidating: $prs"

  revalidate:
    name: "PR #${{ matrix.pr.number }} vs main (${{ matrix.os }})"
    needs: list-open-prs
    if: needs.list-open-prs.outputs.prs != '[]'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # All three, deliberately. The second of today's breakages lived in a
        # `#[cfg(target_os = "macos")]` block, so it compiled out entirely on
        # Linux and Windows; a single-platform check would have missed it.
        os: [ubuntu-latest, macos-latest, windows-latest]
        pr: ${{ fromJson(needs.list-open-prs.outputs.prs) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch and verify the captured PR head
        id: head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "pull/${{ matrix.pr.number }}/head"
          actual_head="$(git rev-parse FETCH_HEAD)"
          expected_head='${{ matrix.pr.sha }}'
          if [[ "$actual_head" != "$expected_head" ]]; then
            echo "::warning::PR #${{ matrix.pr.number }} moved from $expected_head to $actual_head; skipping this stale matrix leg"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      # A moving PR is normal while contributors are pushing fixes. Record the
      # race in Actions-owned step metadata, then leave the job green without
      # executing either revision. The trusted reporter checks this marker and
      # the live PR head before it publishes any status.
      - name: PR head moved during revalidation
        if: steps.head.outputs.stale == 'true'
        shell: bash
        run: |
          echo "PR #${{ matrix.pr.number }} moved; no verdict will be published for ${{ matrix.pr.sha }}"

      - name: Merge the PR into current main
        if: steps.head.outputs.stale != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git merge --no-edit --no-ff '${{ matrix.pr.sha }}'; then
            git merge --abort || true
            echo "::error::PR #${{ matrix.pr.number }} conflicts with current main"
            exit 1
          fi

      - name: Install Linux packages
        if: steps.head.outputs.stale != 'true' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libdbus-1-dev dbus at-spi2-core

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: steps.head.outputs.stale != 'true'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.head.outputs.stale != 'true'
        with:
          # The merged tree contains fork-controlled code. It may consume a
          # trusted cache, but must never persist cache entries for later jobs.
          save-if: false

      # Build the tests without running them. This catches the failure mode
      # that actually bit us — a rename or signature change on `main` that no
      # longer matches the PR — for a fraction of the cost of the full suite,
      # which the PR's own checks already run.
      - name: Build the merged tree
        if: steps.head.outputs.stale != 'true'
        run: cargo test --workspace --all-targets --locked --no-run

  report:
    name: Report revalidation verdicts
    needs:
      - list-open-prs
      - revalidate
    if: ${{ always() && needs.list-open-prs.result == 'success' && needs.list-open-prs.outputs.prs != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: read
      statuses: write
    steps:
      # Do not accept a verdict file from the untrusted build. GitHub's jobs
      # API is the trust boundary: job names and conclusions are recorded by
      # Actions itself and cannot be rewritten by code from a fork.
      - name: Report trusted job conclusions on PR heads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRS_JSON: ${{ needs.list-open-prs.outputs.prs }}
        run: |
          set -euo pipefail

          # Include every run attempt so "Re-run failed jobs" retains matrix
          # legs that succeeded in an earlier attempt. For jobs that were
          # rerun, trust only the newest attempt recorded by Actions.
          jobs_json="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100&filter=all" \
            | jq '[.[].jobs[]
                  | {id, name, conclusion, run_attempt,
                     steps: [.steps[]? | {name, conclusion}]}]
                  | sort_by(.name, .run_attempt, .id)
                  | group_by(.name)
                  | map(last)')"

          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            --jq .object.sha)"
          main_is_current=false
          if test "$current_main" = "$GITHUB_SHA"; then
            main_is_current=true
          else
            echo "::warning::main advanced from $GITHUB_SHA to $current_main; publishing failure statuses"
          fi

          while IFS= read -r pr; do
            number="$(jq -r '.number' <<< "$pr")"
            sha="$(jq -r '.sha' <<< "$pr")"
            if [[ ! "$number" =~ ^[1-9][0-9]*$ ]] || [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::invalid PR identity from list job"
              exit 1
            fi

            current_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq .head.sha)"
            if test "$current_head" != "$sha"; then
              echo "::notice::PR #$number moved from $sha to $current_head; skipping stale verdicts"
              continue
            fi

            for os in ubuntu-latest macos-latest windows-latest; do
              job_name="PR #$number vs main ($os)"
              match_count="$(jq --arg name "$job_name" \
                '[.[] | select(.name == $name)] | length' <<< "$jobs_json")"
              if test "$match_count" -ne 1; then
                conclusion=missing
              else
                conclusion="$(jq -r --arg name "$job_name" \
                  '.[] | select(.name == $name) | .conclusion' <<< "$jobs_json")"
              fi

              stale_marker="$(jq -r --arg name "$job_name" \
                '[.[] | select(.name == $name) | .steps[]?
                  | select(.name == "PR head moved during revalidation")]
                 | if length == 1 then .[0].conclusion else "missing" end' \
                <<< "$jobs_json")"

              # This protects the pathological move-away-then-back race: the
              # live head can equal the captured SHA again even though this
              # matrix leg deliberately skipped its build.
              if test "$stale_marker" = success; then
                echo "::notice::$job_name observed a moved head; skipping its stale verdict"
                continue
              fi

              if test "$main_is_current" != true; then
                state=failure
                description='main advanced; rerun revalidation'
              elif test "$conclusion" = success && test "$stale_marker" = skipped; then
                state=success
                description='Merges and builds against current main'
              else
                state=failure
                description="Revalidation job concluded: $conclusion"
              fi

              gh api "repos/$GITHUB_REPOSITORY/statuses/$sha" \
                -f state="$state" \
                -f context="revalidate vs main ($os)" \
                -f description="$description" \
                -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            done
          done < <(jq -c '.[]' <<< "$PRS_JSON")
