[package]
include = [
    "browser_registry.json",
    "build.rs",
    "src/**/*",
    "Cargo.toml",
    "../MIT-LICENSE.txt",
    "../README.md",
    "examples/**/*",
]
name = "rookie-cookies"
version.workspace = true
edition = "2021"
description = "Load cookie from your web browsers"
license-file = "../MIT-LICENSE.txt"
homepage = "https://crates.io/crates/rookie-cookies"
documentation = "https://docs.rs/rookie-cookies/"
repository = "https://github.com/teng-lin/rookie-cookies"
readme = "../README.md"
keywords = ["windows", "cookies", "rust", "web"]

[lib]
name = "rookie_cookies"
path = "src/lib.rs"


[dependencies]
byteorder = "1"
indoc = "2.0.5"
anyhow = "1"
glob = "0.3"
log = "0.4"
lz4_flex = "0.11"
regex = "1"
libsqlite3-sys = { version = "=0.38.2", default-features = false, features = ["bundled"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "fallible_uint"] }
rust-ini = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
url = "2"
rand = "0.8.5"
once_cell = "1.20.2"
zeroize = "1"
schemars = { version = "0.8", features = ["preserve_order"], optional = true }

[dev-dependencies]
tracing-subscriber = "0.3.18"
base64 = "0.22"

[[bin]]
name = "generate-dto-schema"
path = "src/bin/generate-dto-schema.rs"
required-features = ["dto-schema"]

[features]
default = ["appbound"]
appbound = []
# JsonSchema derives for the report_core.rs DTO types, used only by the
# generate-dto-schema binary (issue #241). Optional so every other consumer
# of this crate -- the CLI, and the Python/Node bindings -- doesn't pull in
# schemars and its transitive deps for a capability they never call.
dto-schema = ["dep:schemars"]

[target.'cfg(unix)'.dependencies]
aes = { version = "0.8", features = ["zeroize"] }
cbc = { version = "0.1", features = ["zeroize"] }
pbkdf2 = "0.12"
sha1 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
async-io = "2"
futures-lite = "2"
getrandom = "0.2"
zbus = "5.19"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
pbkdf2 = "0.12"
sha1 = "0.10"

[target.'cfg(windows)'.dependencies]
aes-gcm = "0.10"
base64 = "0.22"
chacha20poly1305 = "0.10"
libesedb = "0.2"
rawcopy-rs-next = "0.1.3"
privilege = "0.3.0"
windows = { version = "0.51", features = [
    "Wdk",
    "Wdk_System",
    "Wdk_System_SystemServices",
    "Win32_Security_Cryptography",
    "Win32_Security",
    "Win32",
    "Win32_Foundation",
    "Win32_System",
    "Win32_System_RestartManager",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[[example]]
name = "simple"


[[example]]
name = "from_path"
