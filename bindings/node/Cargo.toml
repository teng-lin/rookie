[package]
edition = "2021"
name = "rookie-cookies-node"
version.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
test-support = []
# Windows App-Bound canary only; see the rookie-cookies feature of the same
# name. Never enabled in a published addon.
e2e-appbound-steering = ["rookie-cookies/e2e-appbound-steering"]

[dependencies]
# Keep the Node-API v4 compatibility baseline; dyn-symbols also lets Rust-side
# unit tests link without a Node executable supplying N-API symbols.
napi = { version = "3.12.2", default-features = false, features = ["napi4", "async", "dyn-symbols"] }
napi-derive = "3.6.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }


[target.'cfg(windows)'.dependencies]
rookie-cookies = { workspace = true, features = [
  "appbound",
] }

[target.'cfg(unix)'.dependencies]
rookie-cookies.workspace = true

[build-dependencies]
napi-build = "2.4.1"

[lints]
workspace = true
