[package]
edition = "2021"
name = "rookie-cookies-node"
version.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
test-support = []

[dependencies]
# Default enable napi4 feature, see https://nodejs.org/api/n-api.html#node-api-version-matrix
napi = { version = "2.12.2", default-features = false, features = ["napi4", "async"] }
napi-derive = "2.12.2"
tokio = { version = "1", features = ["rt-multi-thread"] }


[target.'cfg(windows)'.dependencies]
rookie-cookies = { workspace = true, features = [
  "appbound",
] }

[target.'cfg(unix)'.dependencies]
rookie-cookies.workspace = true

[build-dependencies]
napi-build = "2.0.1"

[dev-dependencies]
# Only used by the schema-parity test to parse `schema/report-dto.schema.json`.
# Already part of the build graph via `rookie-cookies`'s own `serde_json`
# dependency (see `rookie-rs/Cargo.toml`).
serde_json = "1"
