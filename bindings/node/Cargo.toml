[package]
edition = "2021"
name = "rookie-cookies-node"
version.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
test-support = []
# Windows App-Bound canary only; see the rookie-cookies feature of the same
# name. Never enabled in a published addon.
e2e-appbound-steering = ["rookie-cookies/e2e-appbound-steering"]

[dependencies]
# Default enable napi4 feature, see https://nodejs.org/api/n-api.html#node-api-version-matrix
napi = { version = "2.12.2", default-features = false, features = ["napi4", "async"] }
napi-derive = "2.12.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }


[target.'cfg(windows)'.dependencies]
rookie-cookies = { workspace = true, features = [
  "appbound",
] }

[target.'cfg(unix)'.dependencies]
rookie-cookies.workspace = true

[build-dependencies]
napi-build = "2.0.1"
