[package]
name = "rookie-cookies-python"
version.workspace = true
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "rookie_cookies"
crate-type = ["cdylib"]

[features]
# Windows App-Bound canary only; see the rookie-cookies feature of the same
# name. Never enabled in a published wheel.
e2e-appbound-steering = ["rookie-cookies/e2e-appbound-steering"]

[dependencies]
log = "0.4"
pyo3 = { version = "0.29", features = ["abi3-py311", "anyhow"] }
pyo3-log = "0.13"

[target.'cfg(windows)'.dependencies]
rookie-cookies = { workspace = true, features = ["appbound", "internet-explorer"] }

[target.'cfg(unix)'.dependencies]
rookie-cookies.workspace = true

[lints]
workspace = true
