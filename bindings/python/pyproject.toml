[build-system]
requires = ["maturin>=1.2,<2.0"]
build-backend = "maturin"

[project]
name = "rookie-cookies"
description = "Load cookies from any browser on any platform"
readme = "README.md"
license = "MIT"
authors = [
    {name = "thewh1teagle"},
    {name = "Teng Lin"},
]
# Version comes from bindings/python/Cargo.toml via maturin. Newer maturin
# (1.6+) requires an explicit declaration here; the older defaults are gone.
dynamic = ["version"]
requires-python = ">=3.8"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Internet :: WWW/HTTP :: Session",
]

[project.urls]
Homepage = "https://github.com/teng-lin/rookie-cookies"
Documentation = "https://github.com/teng-lin/rookie-cookies/blob/main/docs/Python.md"
Repository = "https://github.com/teng-lin/rookie-cookies"
Issues = "https://github.com/teng-lin/rookie-cookies/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
