[package]
name = "rookie-cookies-cli"
version.workspace = true
edition = "2021"
rust-version.workspace = true

[dependencies]
clap = { version = "4.4.6", features = ["derive"] }
ctrlc = { version = "3.4", features = ["termination"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
lazy_static = "1.4.0"
rookie-cookies.workspace = true
# `preserve_order` is what keeps the `send-view` object's `omitted` map in
# `SendOmissions::entries()` order instead of sorting it alphabetically.
# rookie-cookies already enables it, so cargo would unify the feature in
# anyway; declaring it here means this crate's own output does not depend
# on a dependency's feature choice.
serde_json = { version = "1.0.107", features = ["preserve_order"] }

[dev-dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "fallible_uint"] }

[features]
default = ["appbound"]
appbound = ["rookie-cookies/appbound"]
# Windows App-Bound canary only; see the rookie-cookies feature of the same name.
e2e-appbound-steering = ["rookie-cookies/e2e-appbound-steering"]

[[bin]]
name = "rookie-cookies"
path = "src/main.rs"

[lints]
workspace = true
